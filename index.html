   O Marcos cobrou isto DUAS vezes noutras atividades (*"as opcoes de resposta
   estao encostando no enunciado"* e, depois, *"esse encosto no enunciado eu ja
   tinha comentado antes"*). Aqui o portao de leiaute achou o mesmo defeito em
   10 telas x 6 tamanhos: folga ZERO. O balao tem sombra, e o vizinho colado por
   baixo entra nela e parece grudado. Regra de motor, nao conserto de fase — e a
   unica forma de o defeito nao voltar na proxima tela que alguem montar.     */

/* MASCOTE em camadas (lip-sync) */
.broto{position:relative;width:150px;height:150px;-webkit-filter:drop-shadow(0 8px 10px rgba(0,0,0,.22));filter:drop-shadow(0 8px 10px rgba(0,0,0,.22));-webkit-animation:bob 2.8s ease-in-out infinite;animation:bob 2.8s ease-in-out infinite}

/* ⭐ PENSAR e COMEMORAR sao MOVIMENTO da pose parada, nunca desenho novo.
   ⚠️ LICAO PAGA (ago/2026): o montador pedia cinco poses (`_pensa`, `_festa`
   alem das tres); as duas extras davam 404 e, quando mandei o Gemini EDITAR a
   pose parada para cria-las, voltaram dois personagens completamente
   diferentes — o Fuba e um ratinho padeiro em 3D e vieram dois meninos humanos
   em 2D. Desenho novo do mascote sai fora do personagem com uma facilidade
   assustadora; movimento nao tem como sair, porque e o MESMO desenho.
   `pensando`: inclina e desacelera — o corpo dela diz "estou esperando voce",
   sem tirar a vez da crianca. `festejando`: pulinho curto e animado. */
.broto.pensando{-webkit-animation:pensa 2.6s ease-in-out infinite;animation:pensa 2.6s ease-in-out infinite}
.broto.festejando{-webkit-animation:festeja .5s ease-out 3;animation:festeja .5s ease-out 3}
@-webkit-keyframes pensa{0%,100%{-webkit-transform:rotate(-7deg) translateY(0)}50%{-webkit-transform:rotate(-9deg) translateY(-3px)}}
@keyframes pensa{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(-9deg) translateY(-3px)}}
@-webkit-keyframes festeja{0%{-webkit-transform:translateY(0) scale(1)}35%{-webkit-transform:translateY(-22px) scale(1.07)}70%{-webkit-transform:translateY(0) scale(.97)}100%{-webkit-transform:translateY(0) scale(1)}}
@keyframes festeja{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-22px) scale(1.07)}70%{transform:translateY(0) scale(.97)}100%{transform:translateY(0) scale(1)}}

/* ⭐ A VITRINE QUE ENCHE — o progresso que a crianca de 6 anos LE.
   Pesquisa que sustenta: competencia visivel (Deci & Ryan) e o impulso de
   COLECAO. Barra de porcentagem a crianca de 1o ano nao le; vitrine enchendo
   ela le de longe, e quer completar. A cada fase vencida entra um doce atras
   do vidro; no fim a vitrine esta cheia, e aquilo e a foto do dia dela.
   O acabamento e o VIDRO FOSCO da cartela — nao e imitacao de vitrine, e a
   vitrine. (Dos doze acabamentos, este era o unico que nao servia para
   resposta justamente porque a leitura depende do fundo; como superficie, isso
   deixa de ser defeito e vira a qualidade dele.)
   ⚠️ ela SUBSTITUI a barra fina: dois indicadores de progresso na mesma tela
   e ruido, e a altura util no PC da escola e de ~640px. */
.vitrine{position:absolute;top:calc(8px + env(safe-area-inset-top));left:12px;right:12px;
  height:52px;z-index:3;border-radius:14px;padding:4px 8px;
  background:rgba(255,253,246,.42);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  border:2px solid rgba(255,255,255,.7);border-bottom:5px solid rgba(215,171,99,.8);
  -webkit-box-shadow:0 4px 12px rgba(60,45,15,.24);box-shadow:0 4px 12px rgba(60,45,15,.24);
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;align-items:center;-webkit-box-pack:justify;justify-content:space-between;
  overflow:hidden}
.vitrine .vg{-webkit-box-flex:1;-webkit-flex:1 1 0;flex:1 1 0;height:100%;
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;align-items:center;-webkit-box-pack:center;justify-content:center;
  min-width:0}
/* ⚠️ DENTRO DE UM FLEX, `max-width:100%` NAO SEGURA NADA (medido, ago/2026).
   A miniatura e um item flex, e item flex ENCOLHE por padrao (`flex-shrink:1`):
   numa vaga de 26px a figura saia com 11px — o portao do encaixe acusou
   "PEQUENA DEMAIS" dezenas de vezes e eu procurei o defeito na largura da
   vaga, que estava certa. Quem manda a figura NAO encolher e o `flex:none`. */
.vitrine .vg img{-webkit-box-flex:0;-webkit-flex:none;flex:none;
  max-width:100%;max-height:40px;object-fit:contain;
  opacity:0;-webkit-transform:scale(.4) translateY(8px);transform:scale(.4) translateY(8px);
  -webkit-transition:opacity .45s,-webkit-transform .45s cubic-bezier(.2,1.5,.4,1);
  transition:opacity .45s,transform .45s cubic-bezier(.2,1.5,.4,1)}
/* a prateleira vazia: um risquinho, para a crianca ver QUANTO falta */
.vitrine .vg:after{content:"";width:12px;height:3px;border-radius:2px;
  background:rgba(120,90,40,.22);margin-top:16px;margin-left:-100%}
.vitrine .vg.posto img{opacity:1;-webkit-transform:none;transform:none}
.vitrine .vg.posto:after{opacity:0}
@media (max-height:620px){ .vitrine{height:36px} .vitrine .vg img{max-height:26px} }
@media (prefers-reduced-motion: reduce){
  .vitrine .vg img{-webkit-transition:none;transition:none}
}

/* ⚠️ LICAO PAGA TRES VEZES (ago/2026) — A OPCAO ESTICADA. Regra do Marcos:
   *"nada de botoes muito esticado, quero tudo simetrico no app"*. O molde
   antigo era 400px de largura sem piso de altura: uma opcao de uma linha
   media 400x55 = 7,3 vezes mais larga que alta, acima do teto de 6 do portao
   do diretor de arte (`_qa/visual.js`, regra 4). O conserto foi feito TRES
   vezes, na mao, dentro de `escolher`, `completar` e `intruso` — e a quarta
   peca com opcoes repetiria o defeito de novo. Por isso a conta mora AQUI, no
   motor, e nao em cada peca: 360 / 62 = 5,8. As pecas mantem a regra delas
   porque tambem rodam SOZINHAS, fora do motor. */

   botao continuar ao final ficou horrivel, muito grande"*. MEDIDO: 376px de

/* ⭐ A LUPA NÃO CORTA MAIS (pedido do Marcos, ago/2026: "na atividade olhe de
   perto, não cortar as imagens dentro do quadrado"). O quadro tinha um
   scale(1.35) dentro de um overflow:hidden — o alimento aparecia grande, mas
   com as beiradas cortadas, e é justamente o FORMATO INTEIRO que a criança
   precisa olhar para dizer se é raiz, folha ou fruto. Agora o quadro é maior e
   a imagem entra INTEIRA (contain), sem zoom que corte nada.                */
.lupa2{background:rgba(255,255,255,.94);border:4px solid #b7d29a;border-radius:22px;

/* alto-falante discreto: le a resposta para quem ainda nao le.
   ⚠️ LICAO PAGA (ago/2026) — o Marcos apontou este botao TRES vezes ate dizer
   *"esse botao de som esta horrivel. A parte preta tem que estar no meio do
   circulo"*. O desenho vinha de TRES filhos absolutos (`i` corpo, `b` cone,
   `s` onda) com left/top em pixel, repetidos em CADA quebra de tela: 6 blocos
   de aritmetica na mao para um icone de 18px. Bastava um deles sair de lugar
   (ou uma peca redefinir a caixa do `.zap`) para o boneco desmontar — circulo
   de um lado, corpinho do outro, a onda solta como um ")".
   Agora e UM SVG embutido no proprio botao: centra-se sozinho pelo `viewBox`,
   nao tem coordenada para errar e fica nitido em qualquer zoom. Nas telas
   pequenas so muda o `background-size`. Data URI = continua 1 arquivo so.
   ⚠️ A cor mora DENTRO do SVG, entao `background-color` e `background-image`
   ficam SEPARADOS aqui — usar o atalho `background:` em qualquer regra abaixo
   (hover, tocando, variante branca) apagaria o desenho. */
.zap{position:relative;-webkit-flex:none;flex:none;width:30px;height:30px;border-radius:50%;background-color:rgba(58,48,32,.09);border:0;cursor:pointer;padding:0;margin-left:8px;vertical-align:middle;display:inline-block;opacity:.55;-webkit-transition:opacity .2s;transition:opacity .2s;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%233a3020' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%233a3020' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:center center;-webkit-background-size:18px 18px;background-size:18px 18px}
.zap:hover,.zap:active{opacity:1;background-color:rgba(58,48,32,.2)}
/* ⚠️ LICAO PAGA (ago/2026): o glifo do alto-falante e um SVG FILHO em varias
   pecas, com tamanho em pixel proprio. Quando o botao encolhe no celular
   (media query da peca), o desenho NAO encolhe junto e sai 6 a 9px para fora
   do proprio botao — feio e, pior, o alvo do dedo deixa de coincidir com o
   que se ve. Regra no MOTOR, nao na peca: vale para as 79 de uma vez. */
.zap.zap.zap{display:-webkit-inline-box;display:-webkit-inline-flex;display:inline-flex;
  -webkit-box-pack:center;-webkit-justify-content:center;justify-content:center;
  -webkit-box-align:center;-webkit-align-items:center;align-items:center}
.zap>*{max-width:100%;max-height:100%}
/* o desenho em PROPORCAO do botao, nunca em pixel fixo: botao redondo tem
   menos espaco util que a caixa dele, e icone de 24px num botao de 30 encosta
   na borda do circulo. 58% cabe em qualquer tamanho, do 30px ao 64px. */
/* ⚠️ o `.fone.fone` nao e enfeite: o CSS das PECAS entra DEPOIS do motor no
   arquivo montado, entao com peso igual quem manda e a peca — e a peca fixa
   24px. Repetir a classe sobe o peso e devolve a palavra final ao motor,
   que e quem sabe o tamanho do botao. */
.zap .fone.fone.fone,.zap>i.fone.fone,.zap>span.fone.fone{width:58%;height:58%;margin:0;padding:0;
  -webkit-background-size:contain;background-size:contain;
  background-repeat:no-repeat;background-position:center center}
.zap svg{width:100%;height:100%;display:block}
.zap i,.zap b,.zap s{display:none}
.zap.tocando{opacity:1;background-color:rgba(255,212,59,.5);-webkit-animation:zpul .8s ease-in-out infinite;animation:zpul .8s ease-in-out infinite}
/* ⭐ ALTO-FALANTE NA PERGUNTA (pedido do Marcos, ago/2026: "precisa acrescentar
   um botao de som na atividade do 2 ano onde sao as perguntas, para ajudar quem
   nao sabe ler"). No 2o ano MUITA crianca ainda nao le: a narracao toca sozinha
   uma vez, mas se ela se distrai, perdeu. O botao "Ouvir de novo" existe la
   embaixo, na barra — longe do texto e com NOME ESCRITO, que e justamente o que
   ela nao le. O lugar do botao e GRUDADO no enunciado, e ele e um desenho de
   alto-falante, nao uma palavra.                                            */
/* ⚠️ O BOTAO NAO PODE TAPAR A PERGUNTA. A primeira versao pousava no canto de
   cima do balao e cobria a ultima palavra ("Toque na RAI[z]", "Que parte da
   planta e esta[?]"). Um botao de acessibilidade que esconde justamente o texto
   que a crianca precisa e o contrario do que ele existe para fazer. Agora o
   balao ABRE ESPACO para ele (classe `comzap`) e o botao mora dentro desse
   espaco, no meio da altura.                                               */
.balao.comzap{padding-right:56px}
.zapb{position:absolute;right:9px;top:50%;margin-top:-19px;width:38px;height:38px;border-radius:50%;
  background-color:#ffd43b;border:3px solid #fffdf6;cursor:pointer;padding:0;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%234a3a10' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%234a3a10' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:center center;
  -webkit-background-size:22px 22px;background-size:22px 22px;
  -webkit-box-shadow:0 3px 9px rgba(60,45,15,.35);box-shadow:0 3px 9px rgba(60,45,15,.35)}
/* mesmo glifo do `.zap` — dois desenhos diferentes de alto-falante na MESMA
   tela e amadorismo, e era o que estava acontecendo (o do balao tinha duas
   ondas, o das respostas uma so). */
.zapb i,.zapb b,.zapb s{display:none}
.zapb.tocando{background-color:#7bd44a;-webkit-animation:zpul .8s ease-in-out infinite;animation:zpul .8s ease-in-out infinite}
@-webkit-keyframes zpul{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.14)}}
@keyframes zpul{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
/* fundo escuro (relampago, peca usada, ligacao certa) -> desenho branco */
.bin .zap,.pc.usada .zap,.lig.ok .zap{background-color:rgba(255,255,255,.22);
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpath fill='%23ffffff' d='M4 7.6h3.1L11 3.9v12.2L7.1 12.4H4z'/%3E%3Cpath fill='none' stroke='%23ffffff' stroke-width='1.7' stroke-linecap='round' d='M13.3 7.1a4.2 4.2 0 0 1 0 5.8'/%3E%3C/svg%3E")}
.opt .zap,.pc .zap,.bin .zap{margin-left:6px}
.lig .zap{margin:3px 0 0 5px}
/* em tela baixa encolhe o CIRCULO e o desenho junto — uma linha, nao tres
   caixas para reposicionar na mao (era daqui que ele saia torto). */
@media (max-height:720px){ .zap{width:26px;height:26px;margin-left:5px;
  -webkit-background-size:16px 16px;background-size:16px 16px} }
@media (max-height:620px){ .zap{width:23px;height:23px;margin-left:4px;
  -webkit-background-size:14px 14px;background-size:14px 14px} }
/* menu do professor (codigo mestre) — nao e tela de crianca */
.mestre{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-box-pack:center;justify-content:center;gap:6px;margin-top:10px;width:100%;max-width:400px;max-height:56vh;overflow-y:auto}

/* ⭐ REGRA PERMANENTE (Marcos, ago/2026): CARTA DE MEMORIA E GRANDE.
   "quando fizer jogo da memoria faca cartas maiores, registre para sempre".
   A carta e FLUIDA (48% da largura) em vez de ter px fixo: no celular pequeno
   ela ainda entra duas por linha, e no PC ela cresce ate 210px. No PC largo a
   caixa abre para TRES colunas, e ai o tabuleiro inteiro cabe sem rolar.     */
@media (min-width:760px){ .mcartas{max-width:680px} }


/* ⭐ AS FIGURAS TÊM VIDA (ordem do Marcos, ago/2026: *"imagens devem ser lindas,
   sem fundo e animadas se possível"*). Duas animações, e só duas:
   · a figura ENTRA (aparece crescendo um tiquinho) — dá a sensação de que a
     tela respondeu, que é o que prende a criança pequena;
   · a figura da rodada FLUTUA devagar — sinal de "é aqui que você olha".
   ⚠️ nada de piscar, girar ou saltar: numa tela com 8 figuras isso vira
   poluição e atrapalha quem tem dificuldade de atenção.
   ⚠️ quem pediu menos movimento no sistema operacional recebe menos movimento
   (`prefers-reduced-motion`) — é acessibilidade, não enfeite.
   ⚠️ o "sem fundo" NÃO se resolve aqui: vem do RECORTE (a cartela é gerada em
   fundo preto e o `_padrao/cartela.py cortar` transforma em alfa de verdade). */
@-webkit-keyframes figentra{0%{opacity:0;-webkit-transform:scale(.86)}100%{opacity:1;-webkit-transform:scale(1)}}
@keyframes figentra{0%{opacity:0;transform:scale(.86)}100%{opacity:1;transform:scale(1)}}
@-webkit-keyframes figflutua{0%,100%{-webkit-transform:translateY(0)}50%{-webkit-transform:translateY(-5px)}}
@keyframes figflutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pecabox img{-webkit-animation:figentra .3s ease-out both;animation:figentra .3s ease-out both}
.jsFig img,.bsFig img,.oaFig img,.figrod img{
  -webkit-animation:figflutua 3.6s ease-in-out infinite;animation:figflutua 3.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
  .tela{-webkit-animation:fade .3s;animation:fade .3s}
  .pecabox img,.jsFig img,.bsFig img,.oaFig img,.figrod img{
    -webkit-animation:none !important;animation:none !important}
  /* o mascote para de bobear/pensar/festejar, mas a INCLINACAO do "estou
     esperando voce" fica — ela e informacao, nao enfeite. */
  .broto,.broto.festejando{-webkit-animation:none !important;animation:none !important}
  .broto.pensando{-webkit-animation:none !important;animation:none !important;
    -webkit-transform:rotate(-7deg);transform:rotate(-7deg)}
}
/* GERADO por integrar.py — nao editar a mao */

/* ⭐ O BOTAO "PROXIMO" generico (ver o FERRAMENTAS). Mesmo desenho do Broto:
   azul, grande, com a sombra embaixo que afunda ao apertar. */
.pxprox{display:block;margin:14px auto 10px;min-height:52px;padding:13px 30px;border:0;
  border-radius:26px;font-size:19px;font-weight:800;color:#fff;cursor:pointer;
  background:-webkit-gradient(linear,left top,left bottom,from(#3aa0f5),to(#2472c8));
  background:linear-gradient(#3aa0f5,#2472c8);box-shadow:0 5px 0 #1a5698;
  -webkit-animation:pxentra .28s ease;animation:pxentra .28s ease}
.pxprox:active{-webkit-transform:translateY(4px);transform:translateY(4px);box-shadow:0 1px 0 #1a5698}
@-webkit-keyframes pxentra{from{-webkit-transform:translateY(10px);opacity:0}}
@keyframes pxentra{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){ .pxprox{-webkit-animation:none;animation:none} }

/* ⭐ A FESTA DO ACERTO — o CSS da comemoracao generica (ver o olheiro no
   FERRAMENTAS). Vale para as 76 mecanicas: quem ganha a marca de certo pula, e
   sobem faisquinhas. Cobranca do Marcos: "nao tem a comemoracao quando acerta
   como no Broto". */
.pfaisca{position:fixed;width:9px;height:9px;border-radius:50%;pointer-events:none;
  z-index:60;-webkit-animation:pfsobe .95s ease-out forwards;animation:pfsobe .95s ease-out forwards}
@-webkit-keyframes pfsobe{0%{-webkit-transform:translateY(0) scale(.4);opacity:0}
  25%{opacity:1}100%{-webkit-transform:translateY(-58px) scale(1.15);opacity:0}}
@keyframes pfsobe{0%{transform:translateY(0) scale(.4);opacity:0}
  25%{opacity:1}100%{transform:translateY(-58px) scale(1.15);opacity:0}}
.pfesta{-webkit-animation:pfpula .5s ease;animation:pfpula .5s ease}
@-webkit-keyframes pfpula{0%,100%{-webkit-transform:scale(1)}40%{-webkit-transform:scale(1.07)}}
@keyframes pfpula{0%,100%{transform:scale(1)}40%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){
  .pfaisca{display:none}
  .pfesta{-webkit-animation:none;animation:none}
}

/* ============================================================
   ⭐⭐ O JEITO DO BROTO — o molde visual da casa, para as 76 pecas.

   Ordem do Marcos (ago/2026), depois de abrir a Padaria: *"quero atividade
   bonita tipo app como o broto, o visual tem que ser mais caprichado"* e
   *"a atividade tem que ser nos moldes do que a gente vinha fazendo por
   ultimo, com o molde do broto"*.

   ⚠️ O QUE EU TINHA ERRADO: extrai do Broto a MOLDURA (capa, cracha, barra,
   banner, boletim) e deixei as FASES com o visual de cada peca, que nasceu na
   bancada — cartao branco chapado, borda fina, tudo encostado a esquerda. Por
   fora era o Broto; por dentro, nao. Todos os defeitos visuais que ele apontou
   numa noite (nome fora do quadro, letra pela metade, quadrado desalinhado,
   silaba sem cor) sao ESTE unico problema.

   Os valores abaixo NAO foram inventados: sao os do proprio `_jardim/index.html`
   — a mesma paleta, o mesmo raio, a mesma sombra, e a assinatura da casa, que e
   a BORDA DE BAIXO MAIS GROSSA (5px). E ela que da o ar de app, de peca que da
   para apertar.

   Especificidade: as regras da peca entram como `.mec-<nome> .opt` (0,2,0).
   Estas usam tres classes (0,3,0) de proposito — precisam ganhar, e sem
   `!important`, que seria pior de depurar.
   ============================================================ */
/* ⚠️⚠️ LICAO PAGA (ago/2026) — ERA ESTA REGRA que punha o QUADRADO BRANCO
   atras das figuras. Ela unifica o cartao de TODAS as pecas (e por isso usa
   tres classes, para ganhar das regras da peca) — e por isso mesmo o creme
   OPACO dela chegava tambem no cartao que segura uma figura RECORTADA. O
   portao 5b acusou em duas atividades, em quatro tamanhos de tela cada.
   Eu tinha "consertado" nas pecas, uma a uma, e nao adiantou: a regra da peca
   e (0,2,0) e esta e (0,3,0) — quem manda e aqui.
   `.88` continua sendo um cartao creme (a tinta escura passa folgada) e deixa
   a figura assentar na cena em vez de flutuar num retangulo branco. */
.centro .pecabox .opt,.centro .pecabox .pc,.centro .pecabox .ficha,.centro .pecabox .cx{
  background:rgba(255,253,246,.88);border:2px solid #e6dcc6;border-bottom-width:5px;
  border-radius:18px;color:#3a3020;font-weight:600;
  -webkit-box-shadow:0 5px 12px rgba(30,50,20,.16);box-shadow:0 5px 12px rgba(30,50,20,.16)}
.centro .pecabox .opt.ok,.centro .pecabox .pc.ok{border-color:#5bbf3a;background:#eafce0}
.centro .pecabox .opt.no{border-color:#ff7a6b;background:#fff0ee}
.centro .pecabox .balao{background:rgba(255,253,246,.95);border:0;border-radius:22px;
  padding:13px 18px;font-size:17px;font-weight:600;line-height:1.35;
  -webkit-box-shadow:0 6px 18px rgba(30,50,20,.22);box-shadow:0 6px 18px rgba(30,50,20,.22)}
.centro .pecabox .selo{background:#7d3fe0;color:#fff;font-size:13px;font-weight:700;
  padding:5px 12px;border-radius:999px}
/* ⚠️ `background-color`, NUNCA o atalho `background:` — o desenho do
   alto-falante e um SVG que mora no `background-image` do `.zap` (motor). O
   atalho zera o `background-image` junto, e o botao fica um circulo VAZIO.
   Foi exatamente o que aconteceu no dia em que o SVG entrou: no cartao da
   `ouvir-achar` o desenho aparecia, e nas fases de `completar` — que passam
   por esta ponte — o circulo saia em branco. */
.centro .pecabox .zap{width:30px;height:30px;border-radius:50%;
  background-color:rgba(58,48,32,.09);border:0;opacity:.62;padding:0}
/* ⚠️ .55 DE PRATO NAO SEGURA LETRA BRANCA (medido, ago/2026): sobre o ceu
   claro da atividade a mistura dava 3,7:1 — abaixo dos 4,5 — em 14 fases.
   Prato translucido nao e cor: e uma MEDIA com o que estiver atras, e o que
   esta atras muda de tela para tela. Opacidade suficiente para o pior caso
   (fundo branco) e a unica que vale nos dois temas. */
.centro .pecabox .hint{color:#fffdf6;background:rgba(58,48,32,.86);border-radius:999px;
  padding:6px 14px;display:inline-block;font-size:14px}

/* ⭐ O ALTO-FALANTE NAO PODE ESCAPAR DO CARTAO (medido, ago/2026)
   Achado pelo `_qa/vaza.js` — o portao que o Marcos fez nascer quando viu *"o
   dizer da figura fica fora do quadrado branco, ficou feio"*. Ele estava
   pronto ha semanas e NUNCA rodava sozinho: nao estava na banca. Ligado,
   achou na primeira corrida.
   O caso: pecas como a `arrastar-lugar` desenham um cartao de tamanho FIXO
   (74x70px). O motor poe dentro dele o alto-falante da resposta (30px + 8px
   de margem), porque `.pc` esta na lista das respostas tocaveis — e o botao
   sobrava 18px para fora, em TODOS os tamanhos de tela.
   O conserto certo nao e encolher o alto-falante (ele e alvo de dedo de
   crianca e ja esta no minimo): e o cartao CRESCER para caber o que puseram
   dentro dele. Largura e altura viram minimo, e o conteudo manda. */
.centro .pecabox .pc:has(> .zap){width:auto;height:auto;
  min-width:74px;min-height:70px;padding-right:6px}
/* queda para o Chrome 109 da escola, que nao tem `:has()`: ali o cartao ganha
   a folga sempre — dois pixels a mais num cartao sem alto-falante nao fazem
   mal a ninguem, e botao pela metade faz. */
@supports not (selector(:has(*))){
  .centro .pecabox .mec-arrastar-lugar .pc{width:auto;height:auto;
    min-width:74px;min-height:70px}
}

/* ⭐⭐ TEXTO SOLTO SOBRE O FUNDO TEM QUE TER PLACA (medido, ago/2026)
   Pedido do Marcos: *"sempre verificar se nao ha um contraste nas cores, para
   que nao aconteca de a crianca nao conseguir enxergar"*.

   O defeito e de PARENTESCO, nao de descuido: na bancada a peca roda sobre um
   fundo LISO e escuro (#2b2118), e ali o creme e o amarelo dela passam
   folgado. Dentro da atividade o mesmo texto cai sobre a FOTO — a madeira da
   padaria, o ceu do observatorio — e a razao despenca. Medido na Padaria
   depois que o portao do contraste passou a enxergar as fases: 45 textos
   abaixo do minimo, o pior a 1,95:1 ("A PALAVRA E / PAO" em cima da estante).
   Nenhum deles aparecia antes, porque o portao so media as telas de nome.

   A regra da casa: rotulo, contador e frase que ficam DIRETO sobre o fundo
   ganham uma placa escura translucida — o cartao ja tem a dele. A lista cresce
   quando o portao achar um caso novo (agora ele acha).                        */
.centro .pecabox .cont,.centro .pecabox .palv,.centro .pecabox .palvr,
.centro .pecabox .bsVazio,.centro .pecabox .csDiz,.centro .pecabox .csConta,
.centro .pecabox .csEsc,.centro .pecabox .frase,.centro .pecabox .m2_placar{
  display:inline-block;background:rgba(38,28,20,.78);color:#fdf7ec;
  border-radius:14px;padding:5px 14px;opacity:1}
/* a vaga de arrastar tambem: a placa escura faz o numero aparecer E marca melhor
   o lugar onde a peca entra. */
.centro .pecabox .cam{background:rgba(38,28,20,.62);color:#fdf7ec}
/* ⚠️ O BOTAO CLARO DA PECA (o "Recomecar" do pintar) — 1,24:1 medido, creme
   sobre creme. `.btn` e vocabulario COMUM: a regra da peca nao e prefixada e
   quem manda na cor e o tema da atividade, que pinta a letra de creme para a
   madeira escura. So que `.bclaro` troca o fundo para bege e a letra creme
   some. Quem muda o FUNDO tem que mudar a LETRA junto. */
.centro .pecabox .bclaro{color:#3a2a12;text-shadow:0 1px 0 rgba(255,245,220,.55)}

/* ⭐ O MEDALHAO: no Broto a figura da rodada e GRANDE, redonda e centrada — a
   arte e a estrela da tela, nao um selinho no canto do cartao. */
.centro .pecabox .medalhao{width:168px;height:168px;margin:12px auto 4px;border-radius:50%;
  background:rgba(255,253,246,.97);border:4px solid rgba(255,255,255,.75);padding:14px;
  display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;
  -webkit-box-pack:center;justify-content:center;
  -webkit-box-shadow:0 8px 22px rgba(30,50,20,.24);box-shadow:0 8px 22px rgba(30,50,20,.24)}
.centro .pecabox .medalhao img{width:100%;height:100%;object-fit:contain;display:block}
@media (max-height:620px){ .centro .pecabox .medalhao{width:124px;height:124px;padding:10px} }

/* ==== O QUE A PONTE PRECISA (vale para todas as mecanicas) ==== */
/* a barra de DENTRO da fase (quantas palavras achou, que rodada e esta) — a de
   cima, do motor, e a da atividade inteira. Duas informacoes diferentes, entao
   as duas ficam; esta e menorzinha para nao competir com a de cima.          */
.progpeca{height:6px;margin:2px 0 10px;opacity:.85}
/* ⚠️ o SELO da peca e o mesmo rotulo que o motor ja poe em cima, vindo do
   conteudo.json: duas plaquinhas iguais, uma embaixo da outra, so ocupam a tela
   da crianca. O BALAO da peca FICA — nele mora a pergunta da rodada, que muda
   dentro da fase e nao esta no enunciado.                                    */
.pecabox .selo{display:none}
/* ⚠️ LICAO PAGA, medida: com o enunciado da FASE em cima e o balao da PECA
   logo abaixo, o tabuleiro do jogo da memoria comecava tao baixo que 4 das 8
   cartas caiam fora da tela de 640px do monitor da escola. Da para rolar, mas
   memoria e um jogo de VER o tabuleiro: metade escondida acaba com a mecanica.
   E o dobro de enunciado tambem e defeito por si so — a regra da casa e uma
   ideia por tela, enunciado curto (carga cognitiva).
   Entao: quando a peca escreve o balao DELA (a pergunta da rodada), o
   enunciado da fase recolhe. Ele ja foi FALADO na abertura da fase, e o botao
   "Ouvir de novo" continua repetindo — nao se perde nada, ganha-se a tela. */
.centro.tembalaopeca > .balao{display:none}
/* ⚠️⚠️ A COLISAO DE CSS QUE DESMONTAVA O TABULEIRO. Toda peca constroi a tela
   dela com `el("div","tela")` e `el("div","centro")` — os mesmos nomes do
   motor, o que ate aqui era uma vantagem (por isso nenhuma peca precisou ser
   reescrita). So que no motor `.tela` e uma CAMADA ABSOLUTA DE TELA CHEIA
   (`position:absolute;inset:0`) em coluna. Dentro da fase, a tela da peca
   virava uma camada solta por cima de tudo, sem largura propria — e o
   tabuleiro do jogo da memoria, que devia ficar em 3 colunas, empilhava as 8
   cartas numa coluna so, 950px de altura: quatro delas fora da tela do
   monitor da escola. Medido: as 8 cartas no MESMO x.
   Aqui a tela da peca volta a ser o que ela e por dentro da fase: um bloco
   comum. O CSS proprio da peca (com `.mec-<nome>` na frente) manda no resto. */
.pecabox{width:100%}
.pecabox > .tela{position:static;inset:auto;display:block;padding:0;
  -webkit-animation:none;animation:none;height:auto;overflow:visible}
.pecabox > .tela > .centro{width:100%}

/* ============================================================
   TEMA — O LETREIRO DE BLUMENAU (5º ano)

   Entra por ÚLTIMO no `<style>` (ver `montar.py`), então ganha do motor e das
   peças no empate de especificidade. É a camada de IDENTIDADE.

   ⚠️⚠️ POR QUE ESTE ARQUIVO EXISTE — e a decisão foi MEDIDA, não escolhida.
   O fundo desta atividade é uma FOTO de rua: enxaimel, placas, calçada. Foto
   tem meio-tom em todo lugar, e meio-tom é o pior fundo possível para texto:
   o auditor achou 17 textos entre 1,1:1 e 2,9:1 — nem a tinta clara nem a
   escura enxergam ali. Um galpão escuro ou um céu liso perdoam; uma foto não.

   O conserto não é escolher outra tinta: é **acalmar o fundo**. A rua continua
   lá, atrás de um véu de papel claro, e todo o resto da atividade passa a
   trabalhar sobre um tom só. É o que a gráfica de verdade faz quando imprime
   texto sobre foto.

   ⚠️ O que este arquivo NÃO faz: consertar peça. As peças com texto solto
   ganharam a mesa DELAS (ver `_padrao/pecas/*`, lição "texto solto no fundo da
   atividade"), que é o conserto que vale para todas as atividades. Aqui fica
   só o que é identidade DESTA.
   ============================================================ */

/* ---- o véu de papel: a rua continua visível, mas parada ---- */
body{background:#efe6d6}
#bg{opacity:.28}
/* o céu animado do motor não faz sentido numa rua fotografada */
#ceu{opacity:.10}

/* ---- a tinta da casa: escura, como numa placa pintada à mão ---- */
:root{--texto:#2f2718}

/* ---- as plaquinhas de título das peças: metal claro com tinta escura ----
   Elas eram translúcidas e deixavam a foto passar por baixo da letra. */
.cadt,.f2_ctx{background:rgba(255,253,246,.94);color:#2f2718;
  border-radius:12px;padding:4px 12px;display:inline-block}

/* ---- o selo e a barra na cor da oficina ----
   ⚠️ o verde-tinta foi escurecido até passar com a letra branca (4,5:1). */
.selo{background:#2f6b3a}
.prog i{background:#c9622f}

  s=(s||"").replace(/\s+/g," ").replace(/^ | $/g,"").toLowerCase();

/* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem OUVIU, com a atividade na
   mao: *"o da padaria agora e falado duas vezes juntos, soa estranho"*.
   Medido depois: em 4 das 7 fases o MESMO mp3 disparava duas vezes na abertura.
   A causa nasceu de uma boa ideia: varias pecas passaram a NARRAR SOZINHAS ao
   abrir (na bancada, sem motor, a fase ficava muda) — e dentro da atividade o
   motor ja narrava o balao, sempre narrou. Sao dois tocadores diferentes
   (`narr`, do enunciado, e `vz`, das respostas), entao um nao para o outro: as
   duas vozes partem juntas e se atropelam.
   Nao adianta consertar peca por peca: a proxima peca nova repete. O guarda
   mora no TOCADOR, que e por onde tudo passa — pedido repetido da MESMA voz
   dentro de 1,2s e ignorado. De quebra, crianca que aperta o alto-falante duas
   vezes seguidas para de ouvir a voz recomecar picada. */
var _ultVoz={k:null,t:0};
function tocaVoz(k,bt){
  /* ⚠️ a chave tem que ser o ARQUIVO, nao o argumento: o `falar` recebe
     "op_<conta>" e o `tocaVoz` recebe so a "<conta>" — o mesmo mp3 com dois
     nomes. (⚠️ o exemplo aqui era uma chave DE VERDADE, copiada de uma
     atividade; como ela viaja no motor para todas as outras, o portao do
     resto-de-clone a encontrava e acusava marca de atividade alheia num
     arquivo limpo. Comentario tambem e texto — exemplo em comentario se
     escreve com marcador, nunca com um identificador real.)
     Comparar os argumentos crus fazia o guarda achar que eram vozes
     diferentes, e as duas partiam juntas do mesmo jeito. */
  var _ag=(new Date()).getTime(), _kk="op_"+k;
  if(_ultVoz.k===_kk && (_ag-_ultVoz.t)<1200){ if(bt){bt.className="zap tocando";zapAtual=bt;} return; }
  /* ⭐ A REGRA DA FILA, e ela distingue QUEM pediu:
     · voz AUTOMATICA (sem botao) espera a que esta tocando terminar;
     · voz que a CRIANCA pediu (ela apertou o alto-falante, `bt`) INTERROMPE —
       seria ruim apertar o botao e o som so vir depois do enunciado inteiro. */
  if(!bt && _vozTocando()){ _fila=function(){ tocaVoz(k,bt); }; return; }
  _ultVoz.k=_kk; _ultVoz.t=_ag;

  try{ narr.pause(); }catch(e){}

  try{ vz.pause(); vz.currentTime=0; }catch(e){}

/* ⭐ O TEXTO QUE A CRIANCA VE — nao o `textContent` cru.
   ⚠️ DEFEITO QUE O MARCOS PEGOU (ago/2026): *"os botoes de som nao estao
   funcionando na atividade padaria das letras, somente o som do enunciado"*.
   Ele estava certo, e a causa e desta familia: a opcao da `ouvir-achar` guarda,
   ESCONDIDOS, a letra inicial (`.ini`, o andaime) e o aviso "ja tentamos"
   (`.jat`). O `textContent` cru devolvia **"PPAOja tentamos"** em vez de
   **"PAO"** — a chave da voz sai do texto, entao ela nao existia no VOZOK, o
   `poeZap` desistia e a crianca ficava com um alto-falante que nao fala.
   E o pior: NADA quebrava. Sem erro, sem tela torta, com o portao do
   `vozfalta` dizendo que as 428 gravacoes estavam no lugar — porque estavam.
   O que faltava era a CHAVE bater.
   A conta certa e simples: le so o texto VISIVEL, pulando o que esta
   `display:none`/`visibility:hidden` e o proprio botao de som. Vale para toda
   mecanica que esconde andaime dentro da resposta. */
function textoVisivel(elm){
  var out="",i,n,cs;
  for(i=0;i<elm.childNodes.length;i++){
    n=elm.childNodes[i];
    if(n.nodeType===3){ out+=n.nodeValue; continue; }
    if(n.nodeType!==1) continue;
    if(n.className && (" "+n.className+" ").indexOf(" zap ")>=0) continue;
    cs=window.getComputedStyle?getComputedStyle(n):null;
    if(cs&&(cs.display==="none"||cs.visibility==="hidden")) continue;
    out+=textoVisivel(n);
  }
  return out;
}
function poeZap(elm){
  /* a peca pode DECLARAR o que a voz diz (`data-voz`); e mais seguro do que
     deduzir do texto, e e o caminho para toda mecanica que mistura andaime,
     figura e palavra dentro da mesma resposta. */
  var txt=elm.getAttribute&&elm.getAttribute("data-voz")?elm.getAttribute("data-voz"):textoVisivel(elm);
  /* o texto pode TROCAR no mesmo elemento; por isso guardo o texto usado,
     e nao um sim/nao. */
  if(elm.__zaptxt===txt) return;
  elm.__zaptxt=txt;
  var velho=elm.getElementsByClassName("zap")[0];
  var k=temVoz(txt);
  /* ⚠️⚠️ LICAO PAGA (ago/2026), e a que mais dooi no 1o ano: este ajudante
     APAGAVA o alto-falante que a PECA ja tinha posto, e so colocava o dele se
     houvesse mp3 para aquele texto. Nas respostas que sao NOME DE FIGURA (BOLO,
     PAO, MEL) nao ha gravacao — entao ele apagava e nao repunha NADA. A crianca
     que ainda nao le ficava sem nenhum jeito de ouvir as respostas, e a fase
     virava loteria: exatamente o que o Marcos cobrou com todas as letras
     (*"os sons e as dicas sao fundamentais, estao se alfabetizando"*).
     Agora: sem gravacao, o botao da PECA fica onde esta (ela sabe falar o que
     mostra). So substituo quando eu tenho algo melhor a oferecer. */
  if(!k) return;
  /* ⚠️ E O DEFEITO QUE A PROPRIA CORRECAO CRIOU, no mesmo dia (ago/2026):
     com a chave passando a bater, este trecho voltou a APAGAR o botao da peca
     e a por o do motor — e o do motor desenha o icone no `background-image` do
     proprio `.zap`, enquanto o CSS da peca (prefixado, mais forte) pinta
     `background:` no atalho e apaga o desenho junto. Resultado medido pelo
     diretor de arte: circulo AMARELO VAZIO em 12 telas.
     A saida certa nao e brigar por especificidade: se a peca JA tem um
     alto-falante — com o icone dela, bonito, do tamanho que ela desenhou — eu
     so trOCO A FIACAO. O botao continua o dela; a voz passa a ser a do motor. */
  if(velho){
    velho.setAttribute("aria-label","Ouvir esta resposta");
    velho.onclick=function(ev){
      if(ev&&ev.stopPropagation) ev.stopPropagation();
      if(ev&&ev.preventDefault) ev.preventDefault();
      tocaVoz(k,velho);
      return false;
    };
    return;
  }
  var bt=document.createElement("button");
  bt.className="zap"; bt.type="button";
  bt.setAttribute("aria-label","Ouvir esta resposta");
  bt.appendChild(document.createElement("i"));
  bt.appendChild(document.createElement("b"));
  bt.appendChild(document.createElement("s"));
  bt.onclick=function(ev){
    if(ev&&ev.stopPropagation) ev.stopPropagation();
    if(ev&&ev.preventDefault) ev.preventDefault();
    tocaVoz(k,bt);
    return false;
  };
  elm.appendChild(bt);
}

var MEC = {};                 /* nome da mecanica -> function(f, cen, fim) */
var FASES = [];               /* escrito pelo montador */

/* ⚠️ a barra tem que subir na ORDEM REAL de jogo — e ela e calculada da lista,
   nunca escrita a mao. Foi numero escrito a mao que fez a barra do 3o ano andar
   PARA TRAS em duas passagens. */
function progDaFase(i){ return Math.round(4 + 96 * (i / Math.max(1, FASES.length))); }

function montaFase(i, aoFim){
  IFASE = i;
  /* ⚠️ LICAO PAGA: quatro portoes da banca (contraste, leiaute, encaixe e
     imagem quebrada) abrem CADA tela chamando a funcao dela — inclusive sem
     argumento. `montaFase()` virava `FASES[undefined]`, e a linha seguinte
     estourava lendo `.selo` de `undefined`. Quatro portoes cegos de uma vez,
     e a atividade "passava" por nao ter sido medida. Fase que nao existe leva
     ao fim, nunca a uma tela morta. */
  if(!(i >= 0) || i >= FASES.length || !FASES[i]){ paraDeVigiar(); telaFim(); return; }
  /* a cada fase aberta, o marcador da retomada e carimbado de novo */
  _emJogo = true; salvaEstado();

  acordaParada();

  if(VITRINE.length) poeVitrine(t, i); else setProg(t, progDaFase(i));
  var cen = el("div","centro");
  if(f.selo) cen.appendChild(el("div","selo", f.selo));
  if(f.enunciado) cen.appendChild(el("div","balao", f.enunciado));
  t.appendChild(cen); app.appendChild(t);

  /* o andaime que cresce — o mesmo do Broto (ajudaJd), com a dica desta fase */
  var err = 0;
  window.ajuda = function(n, ops){
    ops = ops || {};
    if(n === 1){ if(f.dica) mostraDica(f.dica); else if(ops.dica) mostraDica(ops.dica); }
    else if(n === 2){ consolo(); if(ops.concreto) ops.concreto(); }
    else if(n >= 3){ if(ops.revelar) ops.revelar();
      /* ⚠️ LICAO PAGA: revela PRIMEIRO, escreve a dica DEPOIS — senao a fase se
         conserta sozinha e a crianca nao sabe por que (achado em 5 de 6 pecas). */
      if(ops.porque) setTimeout(function(){ mostraDica(ops.porque); }, 60); }
  };
  window.regFase = function(ok, tent){ if(f.conceito) reg(f.conceito, ok, tent); };

  montaBarra(f.dicaVoz || null, f.dica || null);
  /* ⭐⭐ A VOZ DIZ O QUE ESTA ESCRITO NA TELA — sempre.

     narrava). Duas frases diferentes ao mesmo tempo — para quem nao le, e pior
     que silencio.
     A causa era estrutural: o motor narrava `f.vozIntro` as cegas, sem olhar o
     que a peca tinha acabado de por na tela. E o esqueleto existe justamente
     para isso nao poder acontecer.
     Agora ele ESPERA a peca desenhar, LE o balao de verdade e fala a gravacao
     DAQUELE texto. So cai no `vozIntro` quando a peca nao escreveu balao
     nenhum — ai o enunciado da fase e mesmo o que esta na tela. */
  if(ID.narrar !== "manual"){
    setTimeout(function(){
      var cx = document.getElementsByClassName("pecabox")[0];
      var bs = cx ? cx.getElementsByClassName("balao") : null;
      var txt = (bs && bs.length) ? (bs[0].textContent || "") : "";
      txt = txt.replace(/\s+/g, " ").replace(/^ | $/g, "");
      if(txt && typeof temVoz === "function"){
        var k = temVoz(txt);
        /* ⚠️ o olheiro do balao pode ter chegado ANTES de mim (ele dispara na
           mudanca do DOM, eu num prazo). Se ele ja falou este mesmo texto e o
           audio esta tocando, eu me calo — senao o audio REINICIA e a crianca
           ouve o comeco duas vezes. Foi o que o Marcos ouviu como "duas vozes". */
        if(k){
          if(window.__falouAgora === k && narr && !narr.paused && !narr.ended) return;
          /* ⚠️ o `op_` NAO e enfeite: o `temVoz` devolve so a CONTA do texto,
             e o arquivo gravado chama-se `op_<conta>.mp3` (mesma convencao das

             que nao existe — e a fase ficava MUDA mesmo com a voz gravada. */
          window.__falouAgora = k; falaDaTela("op_" + k); return;

        return;

/* ==== FERRAMENTAS QUE AS PECAS USAM E O MOTOR NAO TINHA ====
   ⚠️ LICAO PAGA (achada pelo auditor-jogador, na 3a fase): o integrador so
   trazia o SEGUNDO <script> da peca (a mecanica). O PRIMEIRO — o motorzinho do
   MOLDE — ficava para tras, e com ele o `nota()` que faz o som. A peca escolher
   passou, a completar passou, e a MEMORIA morreu no primeiro som de carta
   virando. O motor tem `tom()`, mas as pecas foram afinadas com estes numeros
   (PESQUISA-SOM-E-GAMEFEEL), entao o `nota` vem junto.

   ⚠️⚠️ E A SEGUNDA METADE DA MESMA LICAO: o `ac` da peca e uma FUNCAO (destrava
   o som), e o `ac` do motor e o OBJETO AudioContext — o mesmo que alimenta o
   lip-sync do mascote. Declarar a funcao aqui NAO deu erro nenhum: o `var ac=`
   do motor simplesmente sobrescreveu, e a memoria voltou a morrer, agora com
   'ac is not a function'. Nome igual e TIPO diferente e a colisao que nao
   aparece. Solucao: `nota` usa o AudioContext do motor direto, e cada peca
   ganha o SEU `ac()` local dentro do fechamento (ver PONTE) — que destrava com
   `arma()`, o nome que o motor usa para isso, e devolve o contexto.

   Todo o resto do motorzinho (el, limpa, setProg, mostraDica, mostraBanner,
   baguncar, sCerto, sErro, sTap, festa) o motor ja tem com o MESMO nome E o
   mesmo tipo — e por isso a peca nunca precisou ser reescrita. */
function nota(f, dur, vol, tipo, atraso){
  if(typeof arma === "function") arma();
  var c = window.ac; if(!c || !c.createOscillator) return;
  try{
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + (atraso||0);
    o.type = tipo || "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}

var rodada=0, errosSeg=0, respondida=false, telaAtual=null, cartoes=[];

/* ⚠️ cada tela pode ser aberta SOZINHA (é o que os portões de contraste e de
   leiaute fazem). Sem isto, telaPorque() com `rodada` fora da lista montaria
   uma tela vazia — e tela vazia derruba o portão inteiro. */
function garanteRodada(){ if(!RODADAS[rodada]) rodada=0; }

/* ---------------- 1) A TAREFA (só o gatilho) ---------------- */
function telaTarefa(){
  limpa(); garanteRodada();
  errosSeg=0; respondida=false; cartoes=[];
  var f=RODADAS[rodada];
  var t=el("div","tela"); telaAtual=t; setProg(t,rodada*50+4);
  var c=el("div","centro");
  c.appendChild(el("div","selo",f.selo));
  c.appendChild(el("div","balao",f.tarefa));
  var box=el("div","escs"), lista=baguncar(f.esc.slice(0)), i, d;
  for(i=0;i<lista.length;i++){
    d=el("div","opt esc",figuraDe(lista[i])+"<span>"+lista[i].r+"</span>");
    d.dado=lista[i]; d.base="opt esc";
    d.setAttribute("data-qa",lista[i].c?"1":"0");
    d.onclick=escolheuTarefa;
    box.appendChild(d); cartoes.push(d);
  }
  c.appendChild(box);
  c.appendChild(el("div","hint","Escolha e depois eu vou querer saber o porquê."));
  t.appendChild(c); app.appendChild(t);
}
function escolheuTarefa(){
  if(respondida) return;
  sTap();
  if(this.dado.c){ fechaTarefa(this); return; }
  sErro(); errosSeg++;
  this.className="opt esc no treme";
  destreme(this);
  if(errosSeg>=3){ revelaTarefa(); return; }
  mostraDica(RODADAS[rodada].dicas[errosSeg-1]);
  if(errosSeg===2) riscaUmaErrada();
  if(sobrouSoACerta()) revelaTarefa();
}
/* ⚠️ `manter` existe por causa de um defeito achado testando o caminho do ERRO
   (o auditor-jogador só percorre o caminho bom): na revelação do 3º erro a
   frase que EXPLICA a revelação aparecia e sumia no mesmo instante, porque o
   fecho apagava a dica. Quem mais precisa dela é justamente quem errou três
   vezes — então na revelação a dica fica, e a tela seguinte espera. */
function fechaTarefa(b,manter){
  respondida=true;
  b.className="opt esc ok";
  sCerto(); if(!manter) apagaDica();
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    telaPorque();
  },manter?1600:800);
}
function revelaTarefa(){
  var i;
  for(i=0;i<cartoes.length;i++) if(cartoes[i].dado&&cartoes[i].dado.c){
    mostraDica("Este é o lugar. Agora vem a parte boa: <b>o porquê</b>.");
    fechaTarefa(cartoes[i],true); return;
  }
}

/* ---------------- 2) O PORQUÊ (o coração da mecânica) ---------------- */
/* O mascote pergunta e a criança APONTA o desenho. Nunca digitar: campo de
   texto aqui vira barreira motora e mata a mecânica. */
function telaPorque(){
  limpa(); garanteRodada();
  errosSeg=0; respondida=false; cartoes=[];
  var f=RODADAS[rodada];
  var t=el("div","tela"); telaAtual=t; setProg(t,rodada*50+28);
  var c=el("div","centro");
  c.appendChild(el("div","selo","POR QUE DEU CERTO?"));
  c.appendChild(el("div","byte",svgByte()));
  c.appendChild(el("div","balao",f.pq));
  var lista=baguncar(f.cards.slice(0)), i, b;
  var cx=el("div","opts");
  for(i=0;i<lista.length;i++){
    b=el("div","opt",
        '<span class="cardfig">'+figuraDe(lista[i])+'</span><span class="cardtxt">'+lista[i].t+'</span>');
    b.dado=lista[i]; b.base="opt";
    b.setAttribute("data-qa",lista[i].c?"1":"0");
    b.onclick=escolheuPorque;
    cx.appendChild(b); cartoes.push(b);
  }
  c.appendChild(cx);
  c.appendChild(el("div","hint","Toque no desenho que mostra a razão."));
  t.appendChild(c); app.appendChild(t);
}
function escolheuPorque(){
  if(respondida) return;
  sTap();
  if(this.dado.c){ fechaPorque(this); return; }
  sErro(); errosSeg++;
  this.className="opt no treme";
  destreme(this);
  /* ⚠️ o mascote NUNCA responde: ele estreita a PERGUNTA. Quem revela, no 3º
     erro, é o andaime — e só para ninguém ficar preso. */
  if(errosSeg>=3){ revelaPorque(); return; }
  mostraDica(RODADAS[rodada].perguntas[errosSeg-1]);
  if(sobrouSoACerta()) revelaPorque();
}
function fechaPorque(b,manter){
  respondida=true;
  b.className="opt ok";
  sCerto(); if(!manter) apagaDica();
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    proxima();
  },manter?1700:900);
}
function revelaPorque(){
  var i;
  for(i=0;i<cartoes.length;i++) if(cartoes[i].dado&&cartoes[i].dado.c){
    mostraDica("Olhe esta comigo e leia devagar. <b>É essa</b> a razão.");
    fechaPorque(cartoes[i],true); return;
  }
}
function proxima(){
  rodada++;
  if(rodada<RODADAS.length){
    mostraBanner("Você não só acertou: <b>explicou</b>.",telaTarefa);
    return;
  }
  mostraBanner("Duas explicações no bolso!",telaFim);
}

/* ---------------- 3) O FIM (medalha + gancho) ---------------- */
function telaFim(){
  limpa();
  var t=el("div","tela"); telaAtual=t; setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","EXPLICADOR"));
  c.appendChild(el("div","medal","POR QUÊ"));
  c.appendChild(el("div","balao","Quem sabe <b>dizer o porquê</b> não esquece mais."));
  /* fecho com gancho: termina deixando uma pergunta aberta */
  c.appendChild(el("div","hint","E se o copo do sol ficasse <b>tapado</b> com um pratinho? Por quê?"));
  var b=el("button","btn","Explicar de novo");
  b.setAttribute("data-qa","1");
  b.onclick=function(){sTap();rodada=0;telaTarefa();};
  c.appendChild(b);
  t.appendChild(c); app.appendChild(t);
}

/* ---------------- apoio ---------------- */
/* depois da tremida a opção fica RISCADA (forma, não só cor): mostra o que já
   foi descartado — o contrário de punir. Continua tocável, então nunca trava. */
function destreme(b){
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    if(b.className.indexOf("ok")<0) b.className=b.base+" fora";
  },340);
}
function riscaUmaErrada(){
  var i,b;
  for(i=0;i<cartoes.length;i++){
    b=cartoes[i];
    if(!b.dado.c&&b.className.indexOf("fora")<0){ b.className=b.base+" fora"; return; }
  }
}
/* ⚠️ A REDE (lição das primeiras peças, CONTRATO §6): com 3 opções as erradas
   podem acabar ANTES do 3º erro. Sem isto, sobraria uma tela com uma opção só
   e o degrau "revelar" viraria código morto. */
function sobrouSoACerta(){
  var i,vivas=0;
  for(i=0;i<cartoes.length;i++)
    if(!cartoes[i].dado.c&&cartoes[i].className.indexOf("fora")<0) vivas++;
  return vivas===0;
}
function apagaDica(){
  var d=document.getElementById("dicaP");
  if(d&&d.parentNode) d.parentNode.removeChild(d);

/* ==== PECA: bater-silabas ==== */
MEC["bater-silabas"] = function(f, cen, fim){
  cen.className = cen.className + " mec-bater-silabas";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem ouviu: *"onde tenho que
       ouvir a palavra nao funciona; o enunciado funciona, os sons das opcoes
       funcionam"*. So o botao OUVIR A PALAVRA era mudo.
       A causa: a peca sozinha nao tem gravacao nenhuma, entao ela fala pela
       VOZ ROBO do navegador (`speechSynthesis`). No PC da escola essa voz
       simplesmente nao existe (nao ha voz pt-BR instalada) — e falha CALADA,
       sem erro nenhum. O enunciado e as opcoes funcionavam porque passam pelo
       motor, que toca MP3 gravado.
       Aqui a ponte reaponta o `diz` da peca para a voz da casa. A conta da
       chave ignora maiusculas (`chaveVoz` faz `toLowerCase`), entao a palavra
       "pao" acha a gravacao feita para "PAO" — a mesma que o alto-falante da
       opcao ja usa. So cai na voz do navegador se nao houver gravacao. */
    var diz = function(txt){
      try{
        /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem OUVIU: *"o da padaria
           agora e falado duas vezes juntos, soa estranho"*.
           Varias pecas ganharam, no mesmo dia, a boa ideia de NARRAR SOZINHAS ao
           abrir — porque na bancada, sem motor, a fase ficava muda. So que dentro
           da atividade quem narra o balao e o MOTOR, sempre narrou. As duas vozes
           partiam juntas e se atropelavam.
           A peca nao tem como saber se esta na bancada ou na atividade; quem sabe
           e a ponte. Entao e AQUI que se decide: se o texto pedido e o mesmo que o
           motor ja esta dizendo (ou acabou de dizer, na meia janela de abertura da
           fase), a peca cala — o motor ja cumpriu o pedido dela. Qualquer outra
           fala (a palavra, a silaba, a dica) passa normalmente. */
        var _limpa = function(s){ return String(s||"").replace(/<[^>]*>/g," ")
          .replace(/&[a-z]+;|&#\d+;/gi," ").replace(/\s+/g," ").trim().toLowerCase(); };
        var _agora = _limpa(txt);
        if(_agora && window.__dizMotor && window.__dizMotor === _agora) return;
        try{
          var _b = document.getElementsByClassName("balao")[0];
          if(_b && _limpa(_b.textContent) === _agora){
            window.__dizMotor = _agora;
            setTimeout(function(){ window.__dizMotor = null; }, 1200);
            return;
          }
        }catch(_e){}
        var k = (typeof temVoz === "function") ? temVoz(txt) : null;
        if(k && typeof tocaVoz === "function"){ tocaVoz(k); return; }
        if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
        var u = new SpeechSynthesisUtterance(txt);
        u.lang = "pt-BR"; u.rate = .9; u.pitch = 1.05;
        window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
      }catch(e){}
    };
    limpa();

/* ====== A PEÇA COMEÇA AQUI ====== */

/* O CONTEÚDO É SÓ EXEMPLO (padaria, 1º ano). Ao copiar a peça para uma
   atividade, troque APENAS este bloco de dados.
   · pal — a palavra inteira (é ela que o botão OUVIR diz, e a voz repete no fim)
   · sil — as sílabas NA ORDEM: é o número delas que a criança tem que bater
   · voz — A MESMA PALAVRA PICADA, com a pausa ESCRITA (ver abaixo)
   · fig — o nome da figura (img/<fig>.png); a criança não lê
   · d   — os TRÊS degraus do andaime: dica -> ritmo no ouvido -> revela

   ⭐⭐ A VOZ PICADA — POR QUE `voz:"bo... lo"` E NÃO `"BO-LO"`
   Recado do Marcos (ago/2026): *"na hora que fala as sílabas deve ser pausado
   e bem claro"*. Ele estava ouvindo dois defeitos ao mesmo tempo:

   (a) NÃO PAUSAVA. A voz da casa é GRAVADA (Edge TTS, pelo `entregar.yml`, a
       partir do texto escrito no `falas.json`) — não dá para mandar a voz
       "falar devagar" em tempo de jogo, só dá para ESCREVER a pausa. E TTS
       lê pontuação como prosódia: **as reticências geram um silêncio real**
       entre os blocos e reiniciam a entonação de cada um, então "bo... lo"
       sai em dois golpes separados em vez de "bolo" colado. Escolhi
       reticências e não vírgula (a pausa da vírgula é curta demais para a
       criança contar em cima dela) e não ponto final (o ponto derruba a
       entonação, e a palavra picada tem que soar como pergunta em aberto, não
       como frase encerrada). O HÍFEN — "BO-LO" — não pausa NADA: para o TTS
       ele é só um separador de palavra composta.
   (b) NÃO ERA CLARO. Em CAIXA ALTA a voz tende a SOLETRAR o nome das letras
       ("BO" vira "bê-ó") — é a mesma armadilha já registrada no
       `_qa/falas.py` (*"o E tem que ser dito somente 'e'"*). Por isso o campo
       `voz` vai em **minúsculas**: a regra da casa é escrever a fala como a
       voz tem que DIZER, não como se escreve na tela.

   ⚠️ E o `voz` é um CAMPO do conteúdo, não um `join` feito no ato, porque
   quem manda gravar é o montador (`falas_dos_dados` desce o `dados` e grava
   cada frase que a criança ouve). Texto que só existe em tempo de jogo não
   tem gravação — e ficaria mudo justamente na parte que o Marcos apontou.
   Sem o campo, a peça cai no plano B: fala pedaço por pedaço, mais devagar. */
var BATIDAS=[
 {pal:"BOLO", sil:["BO","LO"], voz:"bo... lo", fig:"pd_bolo",
  d:["Diga <b>BOLO</b> bem devagar e bata uma vez para cada peda&#231;o.",
     "Escute: eu vou bater junto com a palavra. Conte comigo.",
     "S&#227;o <b>2</b> peda&#231;os: bo... lo. As batidas j&#225; est&#227;o a&#237;: toque em Pronto."]},
 {pal:"MALA", sil:["MA","LA"], voz:"ma... la", fig:"pd_mala",
  d:["Ponha a m&#227;o no queixo e diga MALA. O queixo desce a cada peda&#231;o.",
     "Escute o ritmo da palavra e conte as batidas.",
     "S&#227;o <b>2</b> peda&#231;os: ma... la. As batidas j&#225; est&#227;o a&#237;: toque em Pronto."]},
 {pal:"SAPATO", sil:["SA","PA","TO"], voz:"sa... pa... to", fig:"pd_sapato",
  d:["Esta &#233; mais comprida. Diga devagar: sa... pa... to.",
     "Escute: eu bato junto com a palavra. Conte as batidas.",
     "S&#227;o <b>3</b> peda&#231;os: sa... pa... to. As batidas j&#225; est&#227;o a&#237;: toque em Pronto."]},
 /* ⚠️ a de UM pedaço só NÃO leva `voz`: não há pausa para escrever, e uma
    palavra curta toda em minúscula o montador descarta como se fosse nome de
    variável (`eh_fala` barra "pão", aceita "PÃO"). Sem `voz`, a peça usa a
    própria sílaba — que o montador já gravou. */
 {pal:"PAO", sil:["PAO"], fig:"pd_pao",
  d:["Cuidado com esta: diga <b>P&#195;O</b>. Quantos peda&#231;os a boca faz?",
     "Escute: a palavra tem UM golpe s&#243;. Bata junto comigo.",
     "&#201; <b>1</b> peda&#231;o s&#243;: p&#227;o. A batida j&#225; est&#225; a&#237;: toque em Pronto."]}
];

var ri=0;        /* rodada de agora */
var bat=0;       /* quantas batidas a criança já deu */
var err=0;       /* erros DESTA rodada (o andaime cresce com ele) */
var ger=0;       /* geração da tela: mata setTimeout de rodada que já saiu */
/* ⚠️ geração do APOIO PELO OUVIDO. O `ger` só troca quando a RODADA troca, e o
   eco do 2º degrau vive DENTRO de uma rodada: se a criança errar de novo antes
   de o eco terminar, os golpes atrasados falavam por cima da revelação — duas
   vozes ao mesmo tempo, e a segunda corta a primeira no motor. Erro novo cala
   o eco velho. */
var eco=0;

/* ⚠️ A FIGURA vem do MOTOR (`imgEl`, que sabe onde mora a pasta `img/`). Aqui na
   bancada ela não existe, e a peça mostra a palavra escrita no lugar. Pegar por
   `window.imgEl` (e não `typeof imgEl`) é de propósito: assim o nome fica
   DECLARADO e o portão "função que não existe" consegue medir. */
var figEl = window.imgEl || null;

/* ⚠️ A VOZ. Dentro de uma atividade montada quem fala é o MOTOR, com o mp3 do
   Edge TTS. Se não houver gravação para aquele texto, a peça fica CALADA — voz
   de navegador nunca vai para a criança. Sozinha, na bancada, aí sim ela usa a
   voz do navegador, só para não se testar no mudo. */
/* ⚠️ O TEXTO QUE A VOZ PROCURA TEM QUE SER O TEXTO QUE A CRIANÇA VÊ.
   As dicas do andaime vêm com marcação e entidade (`<b>2</b>`, `&#231;`), e a
   conta da voz (`temVoz`) é o sha do texto LIMPO — o mesmo `texto_limpo` que o
   montador aplica antes de mandar gravar. Passar a string crua daria um sha
   diferente do arquivo gravado, e a dica falada seria silêncio: o defeito mudo
   de sempre. O navegador decodifica melhor que qualquer regex: joga no
   innerHTML de uma caixa solta e lê o textContent. */
var _cxTxt=document.createElement("div");
function soTexto(h){
  _cxTxt.innerHTML=h||"";
  return (_cxTxt.textContent||"").replace(/\s+/g," ").replace(/^ | $/g,"");
}

function fala(txt){
  txt=soTexto(txt);
  if(typeof window.temVoz==="function"){
    var k=window.temVoz(txt);
    /* ⚠️ o `op_` NAO e enfeite: `temVoz` devolve so a CONTA do texto, e o
       arquivo gravado chama-se `op_<conta>.mp3`. Sem o prefixo a peca pedia
       `audio/<conta>.mp3`, que nao existe — e ficava MUDA mesmo com a voz
       gravada. Mesmo conserto do motor e do olheiro do integrador. */
    if(k && typeof window.falaDaTela==="function") window.falaDaTela("op_"+k);
    return;
  }
  try{
    if(!window.speechSynthesis||!window.SpeechSynthesisUtterance) return;
    var u=new SpeechSynthesisUtterance(txt);
    u.lang="pt-BR"; u.rate=.85; u.pitch=1.05;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch(e){}
}

function sBatida(){ nota(196,.10,.20,"sine",0); nota(660,.02,.09,"square",0); }
function sVolta(){ nota(392,.10,.10,"sine",0); nota(294,.12,.09,"sine",.07); }

/* ⏱️ O COMPASSO. Era 520ms, e 520ms é o erro que o Marcos ouviu: a gravação de
   uma sílaba dura ~0,5s COM o silêncio de entrada, e o motor corta o áudio
   anterior ao começar o próximo (`falar()` faz `narr.pause()`). Resultado: a
   voz falava por cima de si mesma e saía picotada, "bo-lo" atropelado. Com 820
   cada pedaço termina e ainda sobra silêncio — que é o que a criança usa para
   contar. Devagar aqui não é lentidão: é o tempo de a contagem acontecer. */
var PASSO=820;

/* a palavra PICADA, do jeito que a voz vai dizer (ver o bloco A VOZ PICADA) */
function pedacos(r){ return r.voz || r.sil.join("... "); }

/* ⭐ Diz a palavra picada em UMA gravação só, quando ela existe — é a forma
   pausada e clara que o Marcos pediu, e a única que não corre risco de ser
   cortada no meio. Devolve `true` se conseguiu; nesse caso o `ritmo` acende as
   sílabas em silêncio, senão as duas vozes brigariam pelo mesmo alto-falante.
   Sem a gravação (bancada, ou conteúdo antigo sem o campo `voz`), devolve
   `false` e o plano B assume: pedaço por pedaço, no compasso de 820ms. */
function dizPedacos(r){
  var txt=pedacos(r);
  if(typeof window.temVoz==="function" && window.temVoz(soTexto(txt))){ fala(txt); return true; }
  return false;
}

/* uma piscada de vida a cada golpe: o tambor afunda e a figura pulsa junto.
   É o "aconteceu alguma coisa" que a criança de 6 anos precisa ver, já que ela
   não lê nenhum aviso na tela. */
function piscaBatida(){
  var bt=document.getElementById("bsBt"), fg=document.getElementById("bsFg");
  if(bt){ bt.className="bsBater bate";
    setTimeout(function(){ if(bt) bt.className="bsBater"; },200); }
  if(fg){ fg.className="bs_bsFig pulsa";
    setTimeout(function(){ if(fg) fg.className="bs_bsFig"; },360); }
}

function pecaBater(){
  var r=BATIDAS[ri];
  if(!r){ fimDaPeca(); return; }
  err=0; bat=0; ger++;
  limpa();
  var t=el("div","tela");
  setProg(t, Math.round(ri*100/BATIDAS.length));
  var c=el("div","centro");
  c.appendChild(el("div","selo","BATA OS PEDA&#199;OS"));
  c.appendChild(el("div","balao","Diga a palavra da <b>figura</b> e bata uma vez para cada peda&#231;o."));

  var topo=el("div","bsTopo");
  var fg=el("div","bs_bsFig");
  fg.id="bsFg";
  if(figEl){ fg.appendChild(figEl(r.fig)); }
  else { fg.appendChild(el("div","semfig", r.pal)); }
  topo.appendChild(fg);

  /* ⭐ O ALTO-FALANTE DA PALAVRA (apoio sonoro pedido pelo Marcos, ago/2026).
     Ele diz a palavra INTEIRA, nunca picada: saber QUE doce é aquele desenho é
     pré-requisito da fase; saber em quantos pedaços ele se parte É a fase. Sem
     este botão, a criança que não reconhecia o desenho — ou que chamava o bolo
     de "torta" — não tinha porta de entrada nenhuma, e a fase virava sorte. */
  var bo=el("button","bsOuvir");
  bo.type="button"; bo.id="bsOu";
  bo.setAttribute("aria-label","Ouvir a palavra da figura");
  bo.appendChild(el("i","bsFone",""));
  bo.appendChild(document.createTextNode("OUVIR"));
  bo.onclick=function(){
    bo.className="bsOuvir tocando";
    setTimeout(function(){ if(bo) bo.className="bsOuvir"; },700);
    fala(r.pal);
  };
  topo.appendChild(bo);
  c.appendChild(topo);

  /* a linha nasce VAZIA — quem faz as marcas é o dedo da criança */
  var bx=el("div","bsBatidas");
  bx.id="bsBx";
  bx.appendChild(el("span","bsVazio","suas batidas aparecem aqui"));
  c.appendChild(bx);

  var bt=el("button","bsBater","BATER");
  bt.type="button"; bt.id="bsBt";
  bt.onclick=function(){ bate(r); };
  c.appendChild(bt);

  var ln=el("div","bsLinha");
  var lp=el("button","bsLimpa","Apagar"); lp.type="button";
  lp.onclick=function(){ zera(r); };
  var pr=el("button","bsPronto","Pronto"); pr.type="button"; pr.id="bsPr";
  pr.onclick=function(){ confere(r); };
  ln.appendChild(lp); ln.appendChild(pr);
  c.appendChild(ln);

  c.appendChild(el("div","bsTeclado",
    "Tamb&#233;m d&#225; para bater com a <b>barra de espa&#231;o</b> e responder com <b>Enter</b>."));

  t.appendChild(c); app.appendChild(t);
  marcaQA(r);
  fala("Diga a palavra da figura e bata uma vez para cada pedaço.");
}

/* ⭐ A MARCA DE UMA BATIDA — a própria figura, pequenina (pedido do Marcos).
   Fica numa função só porque quem faz marca é o dedo da criança (`bate`) E o
   3º degrau do andaime (`revela`): duas marcas diferentes na mesma tela seria
   exatamente o tipo de resto que a criança nota e a gente não. */
function marcaDeBatida(r, cls){
  var m=el("div", cls||"bsBatida", "");
  if(figEl) m.appendChild(figEl(r.fig));
  return m;
}

function bate(r){
  var bx=document.getElementById("bsBx");
  if(!bx) return;
  if(bat===0) bx.innerHTML="";
  bat++;
  bx.appendChild(marcaDeBatida(r));
  piscaBatida();
  sBatida();
  marcaQA(r);
}

function zera(r){
  var bx=document.getElementById("bsBx");
  bat=0;
  if(bx){ bx.innerHTML=""; bx.appendChild(el("span","bsVazio","suas batidas aparecem aqui")); }
  sTap();
  marcaQA(r);
}

function confere(r){
  if(bat===r.sil.length){ acerta(r); return; }
  /* ⚠️ ERRO NÃO PUNE: som de RETORNO, as batidas se apagam e o andaime cresce.
     Contar errado no 1º ano é o normal — é justamente o que está em treino. */
  err++; sVolta();
  zera(r);
  ajuda(err, r);
}

function acerta(r){
  var meu=ger;
  sCerto(); festa();
  var c=app.querySelector(".centro");
  /* ⭐ AQUI A FALA É PICADA, de propósito: esta peça treina SEPARAR (a irmã
     `juntar-silabas` faz o contrário, e por isso lá o som é contínuo). Cada
     pedaço acende no ritmo da batida, e só no fim a palavra volta inteira —
     para a criança ouvir que os pedaços eram dela o tempo todo. */
  var cx=el("div","bsSilabas"), i;
  for(i=0;i<r.sil.length;i++){
    var s=el("div","bsSil", r.sil[i]);
    s.id="bss"+i;
    cx.appendChild(s);
  }
  c.appendChild(cx);
  /* a gravação inteira ("bo... lo") começa AGORA e corre por cima da animação;
     por isso o `ritmo` acende as sílabas MUDO quando ela existe. */
  var inteiro=dizPedacos(r);
  ritmo(r, 0, meu, function(){
    if(meu!==ger) return;
    /* a palavra volta JUNTA no fim — "os pedaços eram dela o tempo todo".
       O respiro extra quando a gravação picada tocou existe para ela não ser
       cortada na última sílaba: quem começa a falar corta quem estava falando. */
    setTimeout(function(){
      if(meu!==ger) return;
      fala(r.pal);
      setTimeout(function(){
        if(meu!==ger) return;
        ri++;
        if(ri>=BATIDAS.length) fimDaPeca(); else pecaBater();
      },1500);
    }, inteiro?340:0);
  }, inteiro);
}

/* toca o ritmo da palavra: um golpe por sílaba, com a sílaba acesa junto.
   `mudo` = a voz já está dizendo a palavra picada de uma vez só; aqui fica só
   o que se VÊ e o tambor. */
function ritmo(r, i, meu, aoFim, mudo){
  if(meu!==ger) return;
  if(i>=r.sil.length){ if(aoFim) aoFim(); return; }
  var s=document.getElementById("bss"+i);
  if(s) s.className="bsSil toca";
  sBatida();
  if(!mudo) fala(r.sil[i]);
  setTimeout(function(){
    if(meu!==ger) return;
    if(s) s.className="bsSil";
    ritmo(r, i+1, meu, aoFim, mudo);
  },PASSO);
}

/* o ANDAIME que cresce — e que nunca deixa a criança presa.
   ⭐⭐ E QUE AGORA FALA (recado do Marcos, ago/2026: *"tem que ter apoio sonoro
   também"*). As três dicas eram só texto amarelo na tela — para a criança do
   1º ano que ainda não lê, isso é andaime INVISÍVEL: ela errava, a tela
   escrevia a ajuda, e ela continuava sem ajuda nenhuma. Cada degrau agora é
   dito em voz alta com a gravação da própria dica (o montador já grava todo
   texto que sai do `dados`, então não há o que acrescentar no conteúdo). */
function ajuda(n, r){
  var d=r.d||[];
  eco++; var meuEco=eco;   /* cala o eco do erro anterior, se ainda estiver batendo */
  if(n===1){
    var d1=d[0]||"Diga a palavra devagar e bata em cada peda&#231;o.";
    mostraDica(d1); fala(d1);
  }
  else if(n===2){
    var d2=d[1]||"Escute o ritmo da palavra.";
    mostraDica(d2); fala(d2);
    /* apoio pelo OUVIDO — ainda sem escrever a resposta. Espera a dica falada
       terminar: duas vozes ao mesmo tempo não é apoio, é barulho (e a segunda
       cortaria a primeira, que é como o motor troca de áudio). */
    setTimeout(function(){
      if(meuEco!==eco) return;
      ecoDoRitmo(r, meuEco);
    }, 2600);
  }
  else if(n>=3){
    /* revela PRIMEIRO, escreve a dica DEPOIS — senão a fase se conserta
       sozinha e a criança não sabe por quê (lição paga em 5 de 6 peças) */
    revela(r);
    var d3=d[2]||"As batidas j&#225; est&#227;o a&#237;: toque em Pronto.";
    setTimeout(function(){ mostraDica(d3); fala(d3); },60);
  }
}

/* 2º degrau: a peça BATE junto e DIZ os pedaços, sem escrever a resposta.
   ⚠️ antes daqui só saía o golpe do tambor. Percussão sozinha marca o compasso
   mas não diz O QUE está sendo partido — e este é justamente o degrau de quem
   não lê, então ele tem que ser completo pelo ouvido: golpe + pedaço dito +
   figura pulsando. */
function ecoDoRitmo(r, meuEco){
  var meu=ger, i, inteiro=dizPedacos(r);
  for(i=0;i<r.sil.length;i++){
    (function(k){
      setTimeout(function(){
        if(meu!==ger || meuEco!==eco) return;
        sBatida();
        piscaBatida();
        if(!inteiro) fala(r.sil[k]);
      }, 260+k*PASSO);
    })(i);
  }
}

/* 3º degrau: revela os pedaços E já põe as batidas — a criança só confirma */
function revela(r){
  var bx=document.getElementById("bsBx"), c=app.querySelector(".centro"), i;
  if(!bx||!c) return;
  bx.innerHTML="";
  for(i=0;i<r.sil.length;i++) bx.appendChild(marcaDeBatida(r,"bsBatida eco"));
  bat=r.sil.length;
  if(!document.getElementById("bsRev")){
    var cx=el("div","bsSilabas"); cx.id="bsRev";
    for(i=0;i<r.sil.length;i++) cx.appendChild(el("div","bsSil", r.sil[i]));
    var m=el("span","bsMarca","estes"); cx.appendChild(m);
    c.insertBefore(cx, bx);
  }
  marcaQA(r);
}

/* ⭐ AS DUAS PORTAS (regra do Marcos, ago/2026): no PC da escola tem teclado de
   verdade, e a criança vai usar. Espaço = bater; Enter = Pronto; Backspace =
   apagar. O toque continua sendo o caminho principal — isto é um caminho A
   MAIS, nunca o único. */
document.onkeydown=function(e){
  var r=BATIDAS[ri];
  if(!r||!document.getElementById("bsBt")) return;
  /* ⚠️ quem está com o dedo no alto-falante quer OUVIR, não bater. Sem esta
     saída, a criança que chegou no botão pelo Tab apertava Espaço para ouvir
     a palavra e o `preventDefault` daqui embaixo engolia o clique — ela batia
     sem querer e ainda ficava sem a voz. */
  var alvo=e.target||e.srcElement;
  if(alvo && alvo.id==="bsOu") return;
  var k=e.keyCode||e.which;
  if(k===32){ bate(r); if(e.preventDefault) e.preventDefault(); }
  else if(k===13){ confere(r); if(e.preventDefault) e.preventDefault(); }
  else if(k===8){ zera(r); if(e.preventDefault) e.preventDefault(); }
};

/* `data-qa` diz ao auditor-jogador o que serve AGORA: bater enquanto faltam
   batidas, Pronto quando a conta fecha. Só para ele — a criança nunca vê. */
function marcaQA(r){
  var bt=document.getElementById("bsBt"), pr=document.getElementById("bsPr");
  var falta = bat < r.sil.length;
  if(bt) bt.setAttribute("data-qa", falta ? "1" : "0");
  if(pr) pr.setAttribute("data-qa", falta ? "0" : "1");
}

function fimDaPeca(){
  limpa();
  var t=el("div","tela"); setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","medal",""));
  c.appendChild(el("div","balao","Voc&#234; separou <b>"+BATIDAS.length+" palavras</b> em peda&#231;os!"));
  t.appendChild(c); app.appendChild(t);
  mostraBanner("<b>Que ouvido bom!</b><br>Voc&#234; achou os peda&#231;os das palavras.", pecaBater);
}

/* ⚠️⚠️ LICAO PAGA (ago/2026) — O TEMA DO EXEMPLO CRAVADO NA PECA. Esta peca

function pecaCaca(){
  ger++;
  if(relogio){ clearInterval(relogio); relogio=0; }
  limpa();
  var t=el("div","tela");
  setProg(t,0);
  var barraP=t.getElementsByTagName("i")[0];
  /* ⚠️ LICAO PAGA: a grade era SEMPRE LADO x LADO. Palavra maior que o lado
     nunca cabia; `sorteia()` devolvia false as 60 tentativas, a peca seguia com
     a grade incompleta e estourava no primeiro toque — 857 erros de JS numa
     partida, e a crianca presa numa fase sem saida. A grade existe para caber

  var maior = 0, _z;
  for(_z = 0; _z < PAL.length; _z++)
    if(PAL[_z].length > maior) maior = PAL[_z].length;
  var N = Math.max(LADO, maior + 1), g=[], posicoes={}, onde={}, cor={}, achadas={}, cels={};
  var i,j,k,p;

  /* --- 1) sortear a grade ------------------------------------------------
     `cabe` deixa a palavra passar POR CIMA de outra quando a letra bate: e
     assim que nascem os cruzamentos, que sao a graca do caca-palavras (e a
     armadilha nº 5: as letras do cruzamento ja vem marcadas).            */
  function cabe(w,li,co,dl,dc){
    var z,y,x;
    for(z=0;z<w.length;z++){
      y=li+dl*z; x=co+dc*z;
      if(y<0||y>=N||x<0||x>=N) return false;
      if(g[y][x]&&g[y][x]!==w.charAt(z)) return false;
    }
    return true;
  }
  function poe(w,li,co,dl,dc){
    var z,cs=[];
    for(z=0;z<w.length;z++){
      g[li+dl*z][co+dc*z]=w.charAt(z);
      cs.push((li+dl*z)+"_"+(co+dc*z));
    }
    posicoes[w]=cs;
    onde[w]={r:li,c:co,n:w.length,h:(dl===0),dl:dl,dc:dc};
  }
  function zera(){
    var a,b2;
    g=[]; posicoes={}; onde={};

  function cruza(w,li,co,dl,dc){

    return false;

     direção A CADA palavra, saía grade em que NENHUMA palavra estava na
     diagonal — e o enunciado, esse, prometia diagonal sempre. A criança
     varre a diagonal à toa, e "a atividade mentiu" é pior que diagonal
     nenhuma. Agora as quatro direções são um PLANO embaralhado: com cinco
     palavras, as quatro direções entram sempre, a diagonal inclusive.

     E, entre todas as casas onde a palavra cabe, prefere as que CRUZAM outra
     palavra — cruzamento é o que faz um caça-palavras de verdade (e é o que
     exercita a armadilha nº 5: as letras do cruzamento já vêm marcadas). */
  function sorteia(){

      if(comCruz.length&&w>0) esc=comCruz[Math.floor(Math.random()*comCruz.length)];
      else if(vagas.length) esc=vagas[Math.floor(Math.random()*vagas.length)];
      else return false;

    }
    return true;
  }
  function faltaAlguma(){
    var z;
    for(z=0;z<PAL.length;z++) if(!onde[PAL[z]]) return true;

  while(!sorteia()&&voltas<60) voltas++;
  if(faltaAlguma()){
    /* rede de seguranca: se o sorteio nao fechou (praticamente impossivel,

    zera();

  function temDir(dl,dc){

  grade.setAttribute("data-qa",JSON.stringify(onde));
  for(i=0;i<N;i++) for(j=0;j<N;j++){(function(y,x){
    var q=el("div","cp_cel",g[y][x]);
    /* ⭐ A ARMADILHA Nº 1: porcentagem, nunca px. */

    : "Toque em cada letra da palavra. Tocou errado? Toque de novo para tirar."));

  /* --- 4) conferir: `mark` OU `ok` (armadilha nº 5) ---------------------- */
  function pega(id){

    return "na <b>diagonal</b>";
  }

     primeiro a peça REPETE a pista (a criança ainda pode descobrir a palavra
     sozinha — é o que a fase ensina), só depois entrega a palavra e por último
     acende a letra. Entregar a palavra de cara desmancharia a atividade
     inteira. No modo lista continua exatamente como sempre foi: dois degraus. */
  function degrau1(w){
    var pista=porDef?pistaDe(w):"";
    if(pista){
      mostraDica("A pista que falta: <b>"+pista+"</b>");
      voz(pista);
      return false;                 /* ainda há degrau depois deste */
    }
    mostraDica("Procure a palavra <b>"+w+"</b> &#8212; ela est&#225; "+direcaoDe(w)+".");
    return false;
  }
  function degrau2(w){
    mostraDica("&#201; a palavra <b>"+w+"</b> &#8212; ela est&#225; "+direcaoDe(w)+".");
    voz("A palavra e "+w);

  function degrau3(w){

    mostraDica("A palavra <b>"+w+"</b> come&#231;a na letra que est&#225; <b>piscando</b>.");
    return true;                    /* último degrau: o relógio pode parar */
  }
  function relogioAjuda(){
    var nivel=0, meu=ger;
    var passos = porDef ? [degrau1,degrau2,degrau3] : [degrau1,degrau3];
    if(relogio) clearInterval(relogio);

      var w=proxima();

      var ultimo = passos[nivel](w);
      nivel++;
      if(ultimo||nivel>=passos.length){ clearInterval(relogio); relogio=0; }
    },20000);
  }
  relogioAjuda();
}

function semTag(t){

function fazFicha(f){

     so com texto ("BOLACHA") virava adivinhacao. Se a fase nao trouxer figura,
     a ficha continua so com a palavra — nenhuma atividade antiga quebra. */
  var p=el("div","pc","");

    mo.appendChild(figura(f.img,"pcfig"));
    p.appendChild(mo);
  }

     consegue terminar a fase (e so ele olha para isto). */

    if(cliqueDeArrasto()) return;          /* este clique e o rabo do arrasto */
    if(p.className.indexOf("usada")>=0) return;

/* ⚠️ NUNCA `preventDefault` no touchstart acima — mata o toque no celular.

function comeca(p,x,y){
  if(p.className.indexOf("usada")>=0) return;
  pegou=p; x0=x; y0=y; arrastando=false;
  seleciona(p);
}

function move(x,y){

    arrastando=true;

    document.body.appendChild(fantasma);
  }
  fantasma.style.left=(x-52)+"px";
  fantasma.style.top=(y-24)+"px";
}

function solta(x,y){

/* COMPLETAR A LACUNA — a frase quase pronta e o pedaco que falta.

   ante = o que vem antes da lacuna · dep = o que vem depois ·

   · `img` = o nome da arte de IA, sem a pasta e sem o `.png` (OPCIONAL);
   · `voz` = o que o alto-falante diz, quando é diferente do escrito (OPCIONAL).
   Sem `img` nada muda: nenhuma atividade que já usa esta peça quebra.      */
var ENUN="Toque no peda&#231;o que <b>completa</b> a frase.";
