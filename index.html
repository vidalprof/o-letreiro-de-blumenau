    `texto` = a propria LETRA em corpo grande (fases de alfabeto).
    Ficam no exemplo de proposito: e daqui que o montador aprende que a peca
    LE esses campos. */
 pao:   {nome:"P&#195;O", voz:"pão", img:"pd_pao", letra:"P"},
 be:    {nome:"B", voz:"bê", texto:"B", letra:"B"}
};

/* ---------------------------------------------------------------
   2) AS RODADAS. SEMPRE 3 DISTRATORES: com 2 a crianca elimina tudo antes
      do 3o erro (o degrau "revelar" nunca acontece) e com 5 o andaime
      nunca chega nela.
      A escada:  palavra inteira -> palavra inteira com duas figuras da
      mesma familia (arvore/flor) -> o SOM DO COMECO, que e simbolico.
   --------------------------------------------------------------- */
var RODADAS=[
 {selo:"OU&Ccedil;A E ACHE", alvo:"sol", opcoes:["sol","casa","bola","peixe"],
  rotulo:"A PALAVRA &Eacute;", escrito:"SOL", fala:"sol",
  enun:"Ou&#231;a a palavra e toque na <b>figura</b> dela.",
  hint:"Sem som no computador? A palavra est&#225; escrita a&#237; em cima.",
  msg:"Isso! O <b>SOL</b> &#233; este.",
  dicas:["Aperte <b>Ouvir</b> de novo e diga a palavra junto, bem devagar.",
         "Olhe a <b>letra do come&#231;o</b> de cada nome. A palavra come&#231;a com <b>S</b>.",
         "Esta &#233; a figura da palavra <b>SOL</b>: o sol tem raios em volta."]},

 {selo:"OU&Ccedil;A COM CUIDADO", alvo:"arvore", opcoes:["arvore","flor","casa","chave"],
  rotulo:"A PALAVRA &Eacute;", escrito:"&#193;RVORE", fala:"árvore",
  enun:"Agora tem <b>duas</b> figuras do mesmo jardim. Ou&#231;a at&#233; o fim.",
  hint:"&#193;rvore e flor s&#227;o as duas do jardim: o que muda &#233; a palavra.",
  msg:"Isso! <b>&#193;RVORE</b> tem tronco e copa.",
  dicas:["Ou&#231;a de novo at&#233; o <b>fim</b> da palavra: flor acaba r&#225;pido, &#225;rvore &#233; comprida.",
         "A letra do come&#231;o est&#225; em cada figura. A palavra come&#231;a com <b>A</b>.",
         "Esta &#233; a <b>&#193;RVORE</b>: come&#231;a com A e tem tr&#234;s peda&#231;os: &#225;r-vo-re."]},

 {selo:"O SOM DO COME&Ccedil;O", alvo:"flor", opcoes:["flor","peixe","lua","bola"],
  rotulo:"O SOM DO COME&Ccedil;O &Eacute;", escrito:"F", fala:"efe. fffff",
  enun:"Qual figura <b>come&#231;a</b> com este som?",
  hint:"Diga o nome de cada figura em voz alta e escute s&#243; o come&#231;o.",
  msg:"Isso! <b>FLOR</b> come&#231;a com F: fff-lor.",
  dicas:["Diga o nome de cada figura e pare no <b>primeiro pedacinho</b>: fff, ppp, lll, bbb.",
         "A letra do come&#231;o de cada nome apareceu no canto. Procure o <b>F</b>.",
         "<b>FLOR</b> come&#231;a com o som <b>fff</b>. F de flor, de fada, de faca."]}
];

var rodada=0, R=null, erros=0, travada=false, revelando=false;
var ger=0, progVisto=0, acertosDePrimeira=0;
var elAviso=null, elCont=null, progI=null, cartoes=[];

/* ⚠️⚠️ A VOZ — E ELA E SEMPRE GRAVADA.
   Esta funcao NAO fala: ela entrega o texto ao `diz(...)` que a ponte do
   integrador injeta antes do corpo da peca, e que toca o MP3 da casa (Edge
   TTS). Nao ha voz-robo do navegador aqui, e nao pode haver: a ponte desliga a voz
   do navegador em tres camadas, e foi assim que o botao OUVIR desta peca ficou
   MUDO na mao do Marcos, no meio de tudo o mais funcionando. O portao
   `_qa/vozrobo.py` mede isso agora.
   A guarda `typeof diz==="function"` e obrigatoria: na bancada a peca roda
   sozinha, sem ponte e sem gravacao, e chamar direto estouraria na 1a tela.
   As etiquetas saem do texto porque a chave da voz e feita do TEXTO VISIVEL —
   "<b>SOL</b>" e "SOL" tem que dar na mesma gravacao. */
/* ⚠️⚠️ DEFEITO PEGO NA BANCADA, simulando a ponte (ago/2026), e ele teria
   chegado MUDO na crianca: o texto da peca vem com ENTIDADE de HTML
   ("Ou&#231;a a palavra", "at&#233;", "Voc&#234;"). Tirar so as etiquetas com
   uma expressao deixava a entidade crua, e a CHAVE DA GRAVACAO e feita do
   TEXTO: "Ou&#231;a..." nunca bate com o mp3 gravado para "Ouca...". Resultado
   seria o de sempre — botao que nao fala, sem erro nenhum no console.
   O jeito honesto de virar entidade em letra e deixar o NAVEGADOR ler: um
   elemento solto, `innerHTML` de um lado e `textContent` do outro. De quebra
   ele tira as etiquetas sozinho, sem expressao para errar. */
function textoDe(html){
  var d=document.createElement("div");
  d.innerHTML=String(html);
  var t=d.textContent||d.innerText||"";
  return t.replace(/\s+/g," ").replace(/^ | $/g,"");
}
function fala(txt){
  if(!txt) return;
  var t=textoDe(txt);
  if(!t) return;
  if(typeof diz==="function") diz(t);
}
/* ⭐ A SEGUNDA VOZ ESPERA A PRIMEIRA. O enunciado e a palavra tocam na mesma
   tela, um atras do outro; com relogio fixo a palavra entrava POR CIMA do
   enunciado e a crianca perdia os dois (e o mesmo defeito que o portao
   `vozintro.py` pegou em 27 fases da atividade grande). Aqui a peca olha o
   tocador do motor e so segue quando ele cala. Na bancada nao ha tocador
   nenhum: cai no relogio, e nada e cortado porque nada esta tocando. */
function falaEmSeguida(txt,espera){
  var g=ger, gasto=0;
  function som(){ try{ return document.getElementById("vz")||document.getElementById("narr"); }catch(e){ return null; } }
  function tenta(){
    if(g!==ger) return;
    var s=som();
    if(s&&!s.paused&&!s.ended&&gasto<9000){ gasto+=240; setTimeout(tenta,240); return; }
    fala(txt);
  }
  setTimeout(tenta,espera||900);
}
function sVolta(){ nota(392,.10,.11,"sine",0); nota(294,.12,.10,"sine",.08); }
function sPing(){ nota(880,.09,.12,"triangle",0); }

/* ---------------------------------------------------------------
   3) OS DESENHOS — CSS puro, nenhum arquivo externo
   --------------------------------------------------------------- */
/* as OITO figuras que ESTA peca sabe desenhar em CSS. Fora desta lista ela nao
   inventa desenho nenhum — ver o fim de `desenho()`.
   ⚠️ o nome e `ARTE` de proposito: o integrador tem uma lista de nomes que sao
   ARTE ou CONFIGURACAO e que NAO viram gaveta de conteudo no `pecas.json`.
   Batizada `TEMDESENHO`, esta lista aparecia para o montador como se fosse
   conteudo da fase — e nao e: e o que a peca sabe pintar. (O caso inverso ja
   custou caro aqui: o CATALOGO chamava-se `FIG` e sumiu do conteudo, que e
   justamente onde ele PRECISA estar.) */
var ARTE={sol:1,casa:1,bola:1,peixe:1,arvore:1,flor:1,chave:1,lua:1};

function desenho(k){
  var d=el("div","des",""), i, e;
  var F=CATALOGO[k]||{};
  /* ⭐ TRES CAMINHOS, nesta ordem:
     · `img`   — arte de IA (o normal numa atividade de verdade);
     · `texto` — a propria LETRA em corpo grande (fases de alfabeto);
     · senao   — o desenho de CSS das oito figuras de exemplo desta peca.
     ⚠️ E UM QUARTO, QUE FALTAVA E DAVA DEFEITO MUDO: chave que nao e nenhuma
     das tres. O `else` do fim desenhava a LUA — entao uma fase nova com
     `opcoes:["pao","bolo","leite"]` e sem `img` mostrava TRES LUAS iguais, sem
     erro nenhum no console. Agora a peca devolve `null` e o cartao fica so com
     a PALAVRA, em corpo grande (`.oafso`), que e o gemeo escrito de sempre.
     Nenhuma atividade antiga muda: as oito figuras continuam desenhadas. */
  if(F.img){
    if(imgEl){ d.appendChild(imgEl(F.img)); return d; }
    /* na bancada nao existe a pasta `img/`: apontar para um arquivo que nao
       existe poe um QUADRADINHO VAZIO na tela — pior que figura nenhuma, e o
       portao `_qa/imagens.js` reprova com razao. Sem a arte, vale a palavra. */
    return null;
  }
  if(F.texto){ d.appendChild(el("div","destxt", F.texto)); return d; }
  if(!ARTE[k]) return null;
  /* ⚠️ as pecinhas abaixo tem left/top em PIXEL, medidos para 58x58. Elas vao
     TODAS dentro do `.descss`, que tem exatamente esse tamanho — e e o CSS que
     amplia a caixa inteira por escala, sem desmontar o desenho. */
  var caixa=d;              /* o `.des`, que e o lugar no cartao */
  d=el("div","descss","");  /* e a caixa de 58x58 onde os pixels fazem sentido */
  caixa.appendChild(d);
  if(k==="sol"){
    for(i=0;i<8;i++){
      e=el("i","solr","");
      e.style.webkitTransform="rotate("+(i*45)+"deg)";
      e.style.transform="rotate("+(i*45)+"deg)";
      d.appendChild(e);
    }
    d.appendChild(el("i","solc",""));
  }else if(k==="casa"){
    d.appendChild(el("i","ctel","")); d.appendChild(el("i","cpar","")); d.appendChild(el("i","cpor",""));
  }else if(k==="bola"){
    e=el("i","bcir","");
    e.appendChild(el("i","bfai","")); e.appendChild(el("i","bfa2",""));
    e.appendChild(el("i","bcu1","")); e.appendChild(el("i","bcu2",""));
    d.appendChild(e);
  }else if(k==="peixe"){
    d.appendChild(el("i","prab","")); d.appendChild(el("i","pcor","")); d.appendChild(el("i","polh",""));
  }else if(k==="arvore"){
    d.appendChild(el("i","atro","")); d.appendChild(el("i","acop",""));
  }else if(k==="flor"){
    d.appendChild(el("i","fcau",""));
    for(i=0;i<5;i++){
      e=el("i","fpet","");
      e.style.webkitTransform="rotate("+(i*72)+"deg)";
      e.style.transform="rotate("+(i*72)+"deg)";
      d.appendChild(e);
    }
    d.appendChild(el("i","fmio",""));
  }else if(k==="chave"){
    d.appendChild(el("i","kcab","")); d.appendChild(el("i","khas",""));
    e=el("i","kden",""); e.style.left="40px"; d.appendChild(e);
    e=el("i","kden",""); e.style.left="50px"; d.appendChild(e);
  }else{
    d.appendChild(el("i","lua",""));
  }
  return caixa;             /* devolve o `.des`, com o desenho montado dentro */
}
/* a letra do comeco, para o 2o degrau do andaime. Tira o acento (o &Aacute; da
   ARVORE) porque o que a crianca compara e a LETRA, nao o acento. */
/* ⚠️ le por `||{}`: chave desconhecida nao pode ESTOURAR na mao da crianca.
   Ja aconteceu — "Cannot read properties of undefined (reading 'letra')" na
   terceira tela de uma padaria montada. A peca nunca trava. */
function letraDe(k){ var F=CATALOGO[k]||{}; return F.letra || String(F.nome||k).charAt(0); }
function fichaDe(k){ var F=CATALOGO[k]||{}; return {nome:F.nome||String(k).toUpperCase(), voz:F.voz||k}; }

/* ---------------------------------------------------------------
   4) A TELA
   --------------------------------------------------------------- */
function pecaOuvir(){
  limpa();
  R=RODADAS[rodada];
  erros=0; travada=false; revelando=false; cartoes=[]; ger++;
  var t=el("div","tela");
  setProg(t,progVisto);
  progI=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo",R.selo));
  c.appendChild(el("div","balao",R.enun));

  /* ⭐ A CAIXA DE SOM: o botao GRANDE de ouvir em cima, a palavra ESCRITA
     embaixo (o gemeo visual, que faz a peca funcionar no PC sem caixa de som).
     O botao vem PRIMEIRO de proposito: e por ele que a fase comeca. */
  var sc=el("div","somcard","");
  var bo=el("button","obt","");
  bo.type="button";
  bo.appendChild(el("i","fone",""));
  bo.appendChild(document.createTextNode(TEXTOS.ouvir));
  bo.setAttribute("aria-label",TEXTOS.ouvirLeitor);
  bo.onclick=function(){ tocaAlvo(); };
  sc.appendChild(bo);
  var pb=el("div","palvbox","");
  pb.appendChild(el("div","palvr",R.rotulo));
  pb.appendChild(el("div","palv",R.escrito));
  sc.appendChild(pb);
  c.appendChild(sc);

  /* AS FIGURAS, embaralhadas (na Fabrica de Estrelas a certa era sempre a 1a e
     a crianca aprendeu a POSICAO, nao o conteudo) */
  var box=el("div","opts",""), lista=baguncar(R.opcoes.slice(0)), i;
  for(i=0;i<lista.length;i++) box.appendChild(cartao(lista[i]));
  c.appendChild(box);

  elCont=el("div","cont","Figura <b>"+(rodada+1)+"</b> de <b>"+RODADAS.length+"</b>");
  c.appendChild(elCont);
  elAviso=el("div","aviso","");
  c.appendChild(elAviso);
  c.appendChild(el("div","hint",R.hint+" "+TEXTOS.ouvirDica));
  t.appendChild(c);
  app.appendChild(t);
  /* ⭐⭐ A FASE FALA SOZINHA AO ABRIR. No 1o ano a crianca nao sabe que existe
     um botao para apertar: se a tela nasce calada, ela olha e espera. Primeiro
     o enunciado; assim que ele cala, a PALAVRA — e o botao acende junto, para
     ela aprender de onde veio o som e poder repetir sozinha. */
  fala(R.enun);
  falaEmSeguida(R.fala,1100);
  var g=ger;
  setTimeout(function(){ if(g===ger) acendeOuvir(); },1100);
}
/* o botao pisca junto com a palavra: e assim que a crianca liga o som ao lugar
   onde ele se repete. Some sozinho — nao e estado, e um aceno. */
function acendeOuvir(){
  var b=app.getElementsByClassName("obt")[0];
  if(!b) return;
  var g=ger;
  b.className="obt tocando";
  setTimeout(function(){ if(g!==ger) return;
    var x=app.getElementsByClassName("obt")[0]; if(x) x.className="obt"; },900);
}

function cartao(k){
  /* ⚠️ a classe sai em DUAS partes de proposito. O portao `_qa/dinamicas.py`
     reconhece a familia "escolher" pelo literal `el("div","opt"` — escrito
     com a classe composta ja no `el` (opt mais outra) ele nao reconhece nada, e
     "0 dinamica reconhecida" e
     aprovacao VAZIA: o portao passa sem ter medido a armadilha desta mecanica
     (as opcoes embaralhadas). Esta peca E um escolher, entao ela se apresenta
     como um. */
  var o=el("div","opt","");
  o.className="opt oaf";
  /* ⭐ QUEM SABE O QUE A VOZ DEVE DIZER E A PECA. O motor monta a chave do
     alto-falante a partir do TEXTO da resposta — e aqui dentro ha a letra
     inicial (andaime) e a moldura, entao o texto lido saia "PPAO" em vez de
     "PAO" e a voz nao era encontrada. Declarar e mais honesto do que fazer o
     motor adivinhar. (Defeito que o Marcos ouviu: "os botoes de som nao estao
     funcionando... somente o som do enunciado".) */
  var F=fichaDe(k);
  o.setAttribute("data-voz", F.nome);
  o.appendChild(el("div","ini",letraDe(k)));
  /* ⭐ a FIGURA. Quando a fase nao tem figura para esta chave, `desenho()`
     devolve `null` e o cartao passa a ser SO A PALAVRA, em corpo grande — em
     vez de mostrar um desenho emprestado que nao e daquela palavra. */
  var dz=desenho(k);
  if(dz) o.appendChild(dz);
  else o.className=o.className+" oafso";
  var lin=el("div","linha","");
  lin.appendChild(el("span","nom",F.nome));
  var z=el("button","zap","");
  z.type="button";
  z.appendChild(el("i","fone",""));
  z.setAttribute("aria-label","Ouvir "+F.nome);
  /* ⚠️ o alto-falante NAO escolhe: ele so fala. Sem parar o evento aqui, tocar
     no alto-falante valia como resposta — e a crianca que so queria conferir o
     nome levava um erro. */
  z.onclick=function(ev){
    var e=ev||window.event;
    if(e.stopPropagation) e.stopPropagation(); else e.cancelBubble=true;
    /* ⚠️ a voz da RESPOSTA sai do NOME que esta escrito no cartao, nao de um
       apelido: a chave da gravacao (`op_<chave>.mp3`) e feita do texto visivel,
       e foi por um apelido diferente que os alto-falantes ficaram mudos na
       Padaria. `voz` continua servindo a fase que precise de outra pronuncia. */
    sPing(); fala(F.voz||F.nome);
  };
  lin.appendChild(z);
  o.appendChild(lin);
  o.appendChild(el("div","jat","j&#225; tentamos"));
  o.setAttribute("data-qa", k===R.alvo ? "1" : "0");
  o.onclick=function(){ escolhe(k,o); };
  cartoes.push({k:k,el:o,tentada:false});
  return o;
}
function achaCartao(k){ var i; for(i=0;i<cartoes.length;i++){ if(cartoes[i].k===k) return cartoes[i]; } return null; }

/* ⭐ REPETIR E DIREITO DA CRIANCA: este botao pode ser apertado quantas vezes
   ela quiser, sem custo, sem contar como tentativa e sem tirar o andaime. Quem
   ainda nao segura a palavra na cabeca precisa ouvir tres, quatro vezes — e e
   escutando de novo que ela aprende a escutar. */
function tocaAlvo(){
  sPing();
  fala(R.fala);
  acendeOuvir();
}

/* ---------------------------------------------------------------
   5) A ESCOLHA
   --------------------------------------------------------------- */
function escolhe(k,o){
  if(travada||revelando) return;
  var c=achaCartao(k);
  if(c&&c.tentada){
    /* ⚠️ opcao ja tentada nao responde com SILENCIO nem se distingue so pela
       cor: som de retorno + a etiqueta em palavras que ja esta na tela. */
    sVolta();
    mostraDica("Nesta a gente <b>j&#225; tentou</b>. Escute de novo e escolha outra figura.");
    return;
  }
  if(k===R.alvo){ acertou(o); return; }
  errouUma(c,o);
}
function acertou(o){
  travada=true;                     /* ⚠️ trava NO INSTANTE do toque */
  if(erros===0) acertosDePrimeira++;
  /* ⚠️⚠️ LICAO PAGA (ago/2026), e o Marcos viu no celular: aqui estava
     uma ATRIBUICAO ao className (o cartao inteiro trocado por "opt fig certa"),
     que APAGA as outras classes.
     A classe `oaf` (o cartao de vidro fosco) ia embora junto, e o cartao certo
     perdia a moldura da casa bem no momento em que a crianca olha para ele.
     Classe de ESTADO se ACRESCENTA; nunca se troca o crachá inteiro. */
  if(o.className.indexOf("certa")<0) o.className=o.className+" certa ok";
  sCerto();
  /* ⭐ A COMEMORACAO, que o Marcos cobrou: *"nao tem a comemoracao quando acerta
     como no Broto"*. Antes era so um texto verde. Agora o cartao PULA, a festa
     toca e o restante da tela recua — a crianca sabe que acertou sem ler. */
  chuvinha(o);
  if(elAviso){ elAviso.innerHTML=R.msg; elAviso.className="aviso ver"; }
  fala(R.msg);
  /* ⭐ E O BOTAO PROXIMO, como no Broto: *"tem que ter o botao de proximo"*.
     Quem manda no ritmo e a crianca, nao um relogio de 1,6s — ela quer olhar a
     figura certa, ouvir de novo, e so entao seguir. */
  poeProximo();
}

/* faisquinhas em volta do cartao certo — CSS puro, sem imagem e sem biblioteca,
   e some sozinha. Respeita quem pediu menos animacao. */
function chuvinha(o){
  try{
    if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches) return;
    var i,r=o.getBoundingClientRect();
    for(i=0;i<10;i++){
      var f=document.createElement("span");
      f.className="oafaisca";
      f.style.left=(r.left+r.width*(0.15+Math.random()*0.7))+"px";
      f.style.top=(r.top+r.height*(0.2+Math.random()*0.6))+"px";
      f.style.background=["#ffd23f","#7ed957","#ff9f45","#fff"][i%4];
      f.style.webkitAnimationDelay=(i*40)+"ms";
      f.style.animationDelay=(i*40)+"ms";
      document.body.appendChild(f);
      (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },1100); })(f);
    }
  }catch(e){}
}

function poeProximo(){
  var alvo=document.getElementById("navOA");
  if(!alvo){
    alvo=el("div",""); alvo.id="navOA";
    /* ⚠️ o Proximo entra LOGO DEPOIS do "Isso! ..." — nao no fim da tela. No
       fim ele caia atras da barra fixa de baixo (visto na foto do celular), e
       botao que a crianca nao alcanca e botao que nao existe. Aqui ele nasce
       na altura em que o olho dela ja esta: no elogio do acerto. */
    if(elAviso&&elAviso.parentNode) elAviso.parentNode.insertBefore(alvo, elAviso.nextSibling);
    else (app.querySelector(".centro")||app).appendChild(alvo);
  }
  alvo.innerHTML="";
  var b=document.createElement("button");
  b.className="oaprox"; b.type="button"; b.innerHTML="Pr&#243;ximo &#8594;";
  /* ⚠️ LICAO PAGA (ago/2026): botao NOVO nasce com `data-qa`, no MESMO commit.
     Sem isto o auditor nao sabe que ele existe: os robos so tocam no que
     casa com a lista deles (`.opt`, `.btn`, `[data-qa]`...). O errador ficou
     preso nesta tela e reprovou a peca dizendo "nao chega na medalha" — e a
     peca estava certa; quem estava cego era o portao. */
  b.setAttribute("data-qa","prox");
  b.onclick=function(){ if(alvo.parentNode) alvo.innerHTML=""; segue(0); };
  alvo.appendChild(b);
  try{ b.focus(); }catch(e){}
}
function errouUma(c,o){
  if(c){ c.tentada=true; }

/* ---------- o relógio: mede, mas NUNCA prende ---------- */
function ligaRelogio(){
  if(relogio) return;
  relogio=setInterval(passaSegundo,1000);
}
function paraRelogio(){
  if(relogio){ clearInterval(relogio); relogio=null; }
}
function passaSegundo(){
  resta--;
  if(resta<=0){
    resta=0;
    pintaRelogio();
    paraRelogio();
    acabouOTempo();
    return;
  }
  pintaRelogio();
  if(resta<=5) sTap();     /* o tique-taque final tem gemeo visual: o numero */
}
function pintaRelogio(){
  var n=document.getElementById("relnum"), ch=document.getElementById("relcheio");
  if(n) n.innerHTML=""+resta;
  if(ch){
    ch.style.width=Math.round(resta*100/TEMPO)+"%";
    ch.className="relcheio"+(resta<=5?" fim":(resta<=15?" curto":""));
  }
}
/* ⭐ o tempo acabou: a peca FECHA SOZINHA com o resultado. O relogio nunca
   deixa a crianca parada numa tela que nao anda. */
function acabouOTempo(){
  var i;
  for(i=ri;i<RAIO.length;i++) if(faltou.indexOf(RAIO[i].c)<0&&acertos.indexOf(RAIO[i].c)<0)
    faltou.push(RAIO[i].c);
  ri=RAIO.length;
  mostraBanner("Tempo! Vamos ver o que voc&#234; j&#225; sabe de cor.",telaFimRelampago);
}

/* ---------- responder ---------- */
function responde(o,certa,f){
  if(travado) return;
  travado=1;
  trancaTudo();
  if(certa){
    sCerto();
    o.className="opt ok";
    o.innerHTML=o.innerHTML+'<span class="marca">isso!</span>';
    acertos.push(f.c);
    proxima(430);
    return;
  }
  /* ⚠️ SEM ANDAIME e SEM CASTIGO: a certa acende com a marca escrita, a
     rodada anda, e o que faltou volta no boletim como "treinar de novo".
     Nada de X vermelho, nada da palavra "errou". */
  sErro();
  o.className="opt no";
  acendeCerta(f);
  if(faltou.indexOf(f.c)<0) faltou.push(f.c);
  proxima(900);
}
function passa(f){
  if(travado) return;
  travado=1;
  sTap();
  trancaTudo();
  acendeCerta(f);
  if(faltou.indexOf(f.c)<0) faltou.push(f.c);
  proxima(800);
}
function acendeCerta(f){
  var a=app.getElementsByClassName("opt"), i;
  for(i=0;i<a.length;i++){
    if(a[i].getAttribute("data-qa")==="1"&&a[i].className.indexOf("marca")<0){
      a[i].className="opt ok";
      a[i].innerHTML=a[i].innerHTML+'<span class="marca fria">era esta</span>';
    }
  }
}
function trancaTudo(){
  var a=app.getElementsByClassName("opt"), i;
  for(i=0;i<a.length;i++) a[i].onclick=null;
  var p=app.getElementsByClassName("passar");
  for(i=0;i<p.length;i++) p[i].onclick=null;
}
/* ⚠️ o temporizador continua correndo depois do limpa(): sem o guarda da
   geracao ele passaria de pergunta numa tela que ja saiu. */
function proxima(ms){
  var g=ger;
  setTimeout(function(){
    if(g!==ger) return;
    ri++;
    if(ri<RAIO.length&&resta>0) telaRelampago();
    else { paraRelogio(); telaFimRelampago(); }
  },ms);
}

/* ---------- o fim: mostra O QUE ACERTOU. "Errou" não existe aqui. ------- */
function telaFimRelampago(){
  paraRelogio(); ger++;
  /* tela de fim aberta sem ninguem ter respondido (o tempo acabou com a
     crianca parada, ou o auditor chamou a tela direto): e o mesmo estado, e
     ele tem que aparecer INTEIRO — senao a lista do boletim nunca e medida
     pelos portoes de contraste e leiaute. */
  if(!acertos.length&&!faltou.length){
    for(var k=0;k<RAIO.length;k++) faltou.push(RAIO[k].c);
  }
  limpa();
  var t=el("div","tela");
  setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","DE CABE&#199;A"));
  c.appendChild(el("div","medal",""));
  c.appendChild(el("div","balao",
    "Voc&#234; respondeu de cabe&#231;a e acertou <b>"+acertos.length+" de "+RAIO.length+"</b>."));
  var li=el("div","r_lista"), i;
  if(acertos.length){
    li.appendChild(el("div","tit","VOC&#202; ACERTOU"));
    for(i=0;i<acertos.length;i++) li.appendChild(el("div","item acertou","&#10003; "+acertos[i]));
  }
  if(faltou.length){
    li.appendChild(el("div","tit","PARA TREINAR DE NOVO"));
    for(i=0;i<faltou.length;i++) li.appendChild(el("div","item","&#183; "+faltou[i]));
  }
  c.appendChild(li);
  /* ⚠️⚠️ LICAO PAGA (ago/2026) — O BECO. Esta peca fechava com um botao
     "Jogar de novo" que chamava `telaComecarRelampago` DIRETO. Na bancada isso
     e certo; DENTRO da atividade e um beco: a crianca termina o aquecimento da
     fase 13 de 39 e o unico caminho e refazer o MESMO aquecimento, para sempre.
     O integrador tem a ponte que conserta isso (`fimDaPeca = _seguir`), so que
     ela so funciona para quem CHAMA `fimDaPeca` — e esta peca nao chamava,
     porque nem tinha a funcao. A ponte estava armada e mirando no vazio.
     Agora o botao chama `fimDaPeca()`: na bancada ele fecha a peca, na
     atividade ele vai para a fase seguinte. Uma linha, dois lugares certos. */
  var b=el("button","btn","Continuar &#187;");
  b.onclick=function(){ fimDaPeca(); };
  c.appendChild(b);
  t.appendChild(c);
  app.appendChild(t);
}

/* ---------- o fim NA BANCADA (dentro da atividade o integrador troca) ------
   ⚠️ o texto que fala de "peca" mora AQUI e so aqui. Antes ele estava na tela
   de resultado, que a crianca ve dentro da atividade: ela lia "esta e a peca
   RELAMPAGO" no meio da historia da Central de Entregas. */

}
