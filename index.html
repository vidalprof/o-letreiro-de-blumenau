/* ⚠️ A FIGURA vem do MOTOR (`imgEl`, que sabe onde mora a pasta `img/`). Aqui
   na bancada ela não existe, e o pedaço fica só com a palavra — que é o próprio
   contrato: `img` é OPCIONAL. Pegar por `window.imgEl` (e não `typeof imgEl`)
   deixa o nome DECLARADO, e o portão "função que não existe" consegue medir. */
var figEl = window.imgEl || null;

/* ⚠️⚠️ A VOZ É GRAVADA, SEMPRE. Dentro da atividade montada a ponte do
   integrador REAPONTA este `diz` para o mp3 da casa (Edge TTS). Sozinha, na
   bancada, a peça fica calada de propósito: voz-robô do navegador nunca vai
   para a criança (portão `_qa/vozrobo.py`). */
function diz(txt){
  if(!txt) return;
  if(typeof window.temVoz!=="function"||typeof window.tocaVoz!=="function") return;

/* um pedaço pode ser PALAVRA ou {t,img,voz} — aqui os dois viram a mesma
   coisa, para o resto da peça não precisar saber a diferença. */
function pedacoDe(x){
  if(x&&typeof x==="object")
    return {t:x.t||"", img:x.img||null, voz:x.voz||x.t||""};
  return {t:String(x), img:null, voz:String(x)};
}
/* ⚠️ o tamanho do pedaço se mede no que a CRIANÇA vê, não no que está escrito
   no arquivo: "&#225;gua" tem 9 caracteres e 4 letras. Era por isso que uma
   fase de letras acentuadas nunca virava ladrilho — caía na tarja comprida. */
function tamanho(s){
  return String(s).replace(/&#\d+;/g,"x").replace(/&[a-z]+;/g,"x")
                  .replace(/<[^>]*>/g,"").length;
}

/* ⭐ O ALTO-FALANTE DE CADA PEDAÇO.
   ⚠️ ele NÃO escolhe: só fala. Sem parar o evento aqui, tocar no alto-falante
   valia como resposta — e a criança que só queria conferir a palavra levava um
   erro. Defeito já pago em atividade de verdade. */
function fazZap(txt,rot){
  var z=el("button","zap","");
  z.type="button";
  z.setAttribute("aria-label","Ouvir "+(rot||txt));
  z.onclick=function(ev){

    if(e.preventDefault) e.preventDefault();

  barraP=t.querySelector(".prog i");
  var c=el("div","centro");
  c.appendChild(el("div","selo","FRASE "+(rodada+1)+" DE "+FRASES.length));
  if(f&&f.img&&figEl){ var _qf=el("div","qfig",""); _qf.appendChild(figEl(f.img));
                       c.appendChild(_qf); }
  c.appendChild(el("div","balao",ENUN));
  var fr=el("div","frase",f.ante+'<span class="lac">_____</span>'+f.dep);
  c.appendChild(fr);
  lacuna=fr.querySelector(".lac");
  /* ⚠️ o embaralhado tem que acontecer com os pedaços JÁ normalizados: senão a
     comparação com a certa mudaria de forma (texto x objeto) no meio do
     caminho. É a armadilha da mecânica: na Fábrica de Estrelas a certa era
     sempre a 1ª e a criança aprendeu a POSIÇÃO, não o conteúdo. */
  var certo=pedacoDe(f.cer), lista=[certo], i, b, p;
  for(i=0;i<f.out.length;i++) lista.push(pedacoDe(f.out[i]));
  baguncar(lista);

     empilhadas. Ver a licao no CSS de `.opts.curtas`. */
  var curtas=true, soLetra=true, temfig=false;
  for(i=0;i<lista.length;i++){
    if(tamanho(lista[i].t)>4) curtas=false;
    if(tamanho(lista[i].t)>1) soLetra=false;
    if(lista[i].img&&figEl) temfig=true;
  }
  /* figura manda mais que ladrilho: o quadrado de 96px existe para a LETRA
     sozinha; com desenho, o pedaço vira cartão de duas colunas. */
  if(temfig){ curtas=false; soLetra=false; }
  /* ⭐ `letra` ou `silaba`: e o TEMA da atividade que pinta cada um (lousa para
     a letra, biscoito para o pedaco). A peca so DIZ o que aquilo e — ela nao
     escolhe cor nenhuma, senao a mecanica ficaria presa a uma atividade. */
  var cx=el("div","opts"+(curtas?(soLetra?" curtas letra":" curtas silaba"):"")
                        +(temfig?" comfigs":""));
  for(i=0;i<lista.length;i++){
    p=lista[i];
    b=el("div","opt"+(p.img&&figEl?" comfig":""),"");
    /* ⭐ o motor monta a chave da voz a partir do TEXTO da resposta — e aqui
       dentro há figura, alto-falante e, depois do acerto, o carimbo. DECLARAR
       o que a voz deve dizer é mais honesto do que fazer o motor adivinhar. */
    b.setAttribute("data-voz",p.voz);
    if(p.img&&figEl){ var g=el("div","opfig",""); g.appendChild(figEl(p.img)); b.appendChild(g); }
    var ln=el("div","oplin","");
    ln.appendChild(el("span","optxt",p.t));
    ln.appendChild(fazZap(p.voz,p.t));
    b.appendChild(ln);
    b.pedaco=p.t;
    b.certa=(p===certo);
    /* data-qa: a resposta que serve AGORA. E so para o auditor-jogador
       (_qa/jogador.js) conseguir fechar a rodada; a crianca nao ve nada. */
    b.setAttribute("data-qa",b.certa?"1":"0");
    b.onclick=escolheu;
    cx.appendChild(b); botoes.push(b);
  }
  c.appendChild(cx);
  c.appendChild(el("div","hint",DEPOIS));
  t.appendChild(c); app.appendChild(t);
}

function escolheu(){

/* ⚠️ o temporizador da rodada continua correndo depois que a tela sai: sem o
   guarda `!telaAtual.parentNode` ele montaria a rodada por cima da tela
   seguinte. Armadilha registrada no _padrao/DINAMICAS.md. */
function acertou(b){
  respondida=true;
  veste(b,"ok");

  lacuna.innerHTML=b.pedaco;
  sCerto(); apagaDica();

  setTimeout(function(){

function errou(b){

/* ⚠️ o tremor e feito com DUAS classes e transicao, nao com `@keyframes` — os
   keyframes da peca se perdem quando o integrador prefixa o CSS dela (medido
   no `pecas.css`), e o erro deixava de responder DENTRO da atividade, que e

   na tela enquanto ela escolhe o conserto. */

function sTecla(){ nota(220,.035,.12,"square",0); nota(660,.03,.07,"square",.03); }

function telaDitado(){
  limpa();
  ger++;
  pos=0; errosSeg=0; vagas=[]; teclas=[];
  var it=DITADOS[rodada];
  letras=it.txt.replace(/ /g,"");
  var t=el("div","tela"); telaAtual=t;
  setProg(t,Math.round(rodada*100/DITADOS.length));
  barraP=t.querySelector(".prog i");
  var c=el("div","centro"), i, v, b;
  c.appendChild(el("div","selo","DITADO "+(rodada+1)+" DE "+DITADOS.length));
  c.appendChild(el("div","balao","Ou&#231;a e <b>escreva</b> do jeitinho que voc&#234; ouviu."));

  /* o botao de ouvir e GRANDE e pode ser apertado quantas vezes ela quiser:
     ditado nao e prova de memoria. */
  b=el("button","btn","Ouvir de novo");
  b.onclick=function(){ sTap(); dita(); };
  c.appendChild(b);

  vozEl=el("div","voz",ESPERA);
  c.appendChild(vozEl);

  /* as vagas: uma por letra, com o espaco entre as palavras JA POSTO — assim o
     espaco nao vira mais um erro possivel para quem esta aprendendo a escrever */
  var cx=el("div","vagas");
  for(i=0;i<it.txt.length;i++){
    if(it.txt.charAt(i)===" "){ cx.appendChild(el("div","espaco","")); continue; }
    v=el("div","vaga",""); cx.appendChild(v); vagas.push(v);
  }
  c.appendChild(cx);

  /* o teclado da tela: as letras DESTA frase mais tres que nao servem,
     embaralhadas. O `data-qa` e so para o auditor-jogador; a crianca nao ve. */
  var tec=el("div","d3_letras");
  tec.setAttribute("data-qa",letras);
  var banco=letras.split(""), sobra=letrasQueNaoServem(3), k;
  for(k=0;k<sobra.length;k++) banco.push(sobra[k]);
  baguncar(banco);
  for(i=0;i<banco.length;i++){
    b=el("div","tecl",banco[i]);
    b.letra=banco[i];
    b.onclick=toqueTecla;
    tec.appendChild(b); teclas.push(b);
  }
  c.appendChild(tec);

  contaEl=el("div","conta","");
  c.appendChild(contaEl);
  c.appendChild(el("div","hint","Toque nas letras <b>ou</b> use o teclado do computador."));
  t.appendChild(c); app.appendChild(t);

  /* PORTA 2: o teclado de verdade. Vale a mesma regra do toque. */
  document.onkeydown=teclaReal;
  marcaVaga(); atualizaConta();
  dita();
}

function letrasQueNaoServem(quantas){
  var fora=[], i, L;
  for(i=0;i<SOBRA.length&&fora.length<quantas;i++){
    L=SOBRA.charAt(i);
    if(letras.indexOf(L)<0) fora.push(L);
  }
  return fora;
}

/* ---------- A VOZ ----------
   ⚠️ NA ATIVIDADE DE VERDADE esta funcao tem UMA linha: a de baixo, comentada.
   O texto NAO aparece — a crianca so ouve, e por isso e ditado:

       falaDaTela(DITADOS[rodada].id);

   Aqui, como a peca roda sozinha e nao existe arquivo de audio dentro dela, o
   ditado chega ESCRITO por 2,2s e some. A crianca (e o auditor) continua tendo
   de escrever depois que o texto sai da tela.                               */
function dita(){
  if(!telaAtual||!telaAtual.parentNode||!vozEl) return;
  var meu=++ger;
  vozEl.className="voz falando";
  vozEl.innerHTML=DITADOS[rodada].txt;
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode||meu!==ger) return;
    vozEl.className="voz";
    vozEl.innerHTML=ESPERA;
  },2200);
}

/* ---------- as DUAS portas de entrada da mesma letra ---------- */
function toqueTecla(){
  if(this.className.indexOf("usada")>=0) return;
  sTap();
  usaLetra(this.letra,this);
}
/* ⚠️ o guarda `!telaAtual.parentNode` aqui e o que impede o teclado de ficar
   preso na fase anterior quando a tela ja trocou. */
function teclaReal(ev){
  if(!telaAtual||!telaAtual.parentNode) return;
  var k=ev.key||"";
  if(!k&&(ev.keyCode||ev.which)) k=String.fromCharCode(ev.keyCode||ev.which);
  k=String(k).toUpperCase();
  if(k.length!==1||ALFA.indexOf(k)<0) return;
  usaLetra(k,achaTecla(k));
}
function achaTecla(k){
  var i;
  for(i=0;i<teclas.length;i++)
    if(teclas[i].letra===k&&teclas[i].className.indexOf("usada")<0) return teclas[i];
  return null;
}

/* ---------- a regra da fase ---------- */
function usaLetra(k,bot){
  if(!telaAtual||!telaAtual.parentNode) return;
  if(pos>=letras.length) return;
  if(k===letras.charAt(pos)) poeLetra(k,bot||achaTecla(k)); else erraLetra(bot);
}
function poeLetra(k,bot){
  vagas[pos].className="vaga cheia";
  vagas[pos].innerHTML=k;
  if(bot) bot.className="tecl usada";
  pos++; errosSeg=0;
  apagaDica(); limpaPisca(); marcaVaga(); atualizaConta();
  sTecla();
  if(barraP) barraP.style.width=
    Math.round((rodada+pos/letras.length)*100/DITADOS.length)+"%";
  if(pos>=letras.length){ sCerto(); fechaRodada(); }
}
function erraLetra(bot){
  sErro(); errosSeg++;
  if(bot){ bot.className="tecl treme"; destreme(bot); }
  ajuda(errosSeg);
}
function destreme(b){
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    if(b.className.indexOf("usada")<0) b.className="tecl";
  },340);
}
/* o andaime CRESCE: ouvir de novo -> a letra da vez pisca -> revelar e seguir.
   Nunca X, nunca a palavra "errou", nunca fica travado. */
function ajuda(n){
  if(n===1){
    mostraDica("Vou ditar de novo, com calma. "+DITADOS[rodada].dic);
    dita();
  }else if(n===2){
    mostraDica("A letra que vem agora est&#225; <b>piscando</b> no teclado.");
    acendeCerta();
  }else{
    mostraDica("Era esta! Eu ponho e voc&#234; segue.");
    revela();
  }
}
function acendeCerta(){
  var b=achaTecla(letras.charAt(pos));
  limpaPisca();
  if(b) b.className="tecl d3_pisca";
}
function limpaPisca(){
  var i;
  for(i=0;i<teclas.length;i++)
    if(teclas[i].className.indexOf("d3_pisca")>=0) teclas[i].className="tecl";
}
function revela(){
  var k=letras.charAt(pos);
  poeLetra(k,achaTecla(k));
}
function apagaDica(){
  var d=document.getElementById("dicaP");
  if(d&&d.parentNode) d.parentNode.removeChild(d);
}
/* a vaga da vez fica marcada (borda + fundo), para a crianca saber ONDE esta
   escrevendo. Nao e so cor: a borda muda de tracejada para grossa amarela. */
function marcaVaga(){
  var i;
  for(i=0;i<vagas.length;i++)
    if(vagas[i].className.indexOf("cheia")<0)
      vagas[i].className=(i===pos)?"vaga dae":"vaga";
}
function atualizaConta(){
  if(!contaEl) return;
  var falta=letras.length-pos;
  contaEl.innerHTML=falta? ("Faltam <b>"+falta+"</b> letra(s).") : "Tudo escrito!";
}

/* ⚠️ o temporizador da rodada continua correndo depois que a tela sai. Sem o
   guarda `!telaAtual.parentNode` ele montaria a rodada seguinte por cima de
   outra tela — e o `onkeydown` ficaria preso na fase anterior. */
function fechaRodada(){
  setTimeout(function(){
    if(!telaAtual||!telaAtual.parentNode) return;
    proxima();
  },900);
}
function proxima(){
  rodada++;
  if(rodada<DITADOS.length){ telaDitado(); return; }
  document.onkeydown=null;
  mostraBanner("Voc&#234; ouviu e escreveu as tr&#234;s!",fimDaPeca);
}

/* ---------- o fim NA BANCADA (dentro da atividade o integrador troca) ------
   ⚠️ LICAO PAGA (ago/2026), a mesma da `ensinar-mascote`: esta tela tinha
   nome PROPRIO e era chamada direto. A ponte do integrador so troca quem se
   chama `fimDaPeca` — entao, dentro da atividade, a crianca terminava e caia
   AQUI, num "Jogar de novo" que a prendia na mesma fase. O nome e o
   contrato. (E o comentario nao repete a frase do selo: o `_qa/beco.py`

function fimDaPeca(){
  limpa();
  document.onkeydown=null;
  telaAtual=null;
  var t=el("div","tela"); setProg(t,100);
  var c=el("div","centro");
  c.appendChild(el("div","selo","PE&#199;A FECHADA"));
  c.appendChild(el("div","medal",""));
  c.appendChild(el("div","balao","Voc&#234; escreveu <b>ouvindo</b>, letra por letra."));
  var b=el("button","btn","Jogar de novo");
  b.onclick=recomeca;
  c.appendChild(b);
  c.appendChild(el("div","hint","Esta &#233; a pe&#231;a DITADO: teclado da tela e teclado de verdade, os dois."));
  t.appendChild(c); app.appendChild(t);
}

/* ==== PECA: ensinar-mascote ==== */
MEC["ensinar-mascote"] = function(f, cen, fim){
  cen.className = cen.className + " mec-ensinar-mascote";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem ouviu: *"onde tenho que
       ouvir a palavra nao funciona; o enunciado funciona, os sons das opcoes
       funcionam"*. So o botao OUVIR A PALAVRA era mudo.
       A causa: a peca sozinha nao tem gravacao nenhuma, entao ela fala pela
       VOZ ROBO do navegador (`speechSynthesis`). No PC da escola essa voz
       simplesmente nao existe (nao ha voz pt-BR instalada) — e falha CALADA,
       sem erro nenhum. O enunciado e as opcoes funcionavam porque passam pelo
       motor, que toca MP3 gravado.
       Aqui a ponte reaponta o `diz` da peca para a voz da casa. A conta da
       chave ignora maiusculas (`chaveVoz` faz `toLowerCase`), entao a palavra
       "pao" acha a gravacao feita para "PAO" — a mesma que o alto-falante da
       opcao ja usa. So cai na voz do navegador se nao houver gravacao. */
    var diz = function(txt){
      try{
        /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem OUVIU: *"o da padaria
           agora e falado duas vezes juntos, soa estranho"*.
           Varias pecas ganharam, no mesmo dia, a boa ideia de NARRAR SOZINHAS ao
           abrir — porque na bancada, sem motor, a fase ficava muda. So que dentro
           da atividade quem narra o balao e o MOTOR, sempre narrou. As duas vozes
           partiam juntas e se atropelavam.
           A peca nao tem como saber se esta na bancada ou na atividade; quem sabe
           e a ponte. Entao e AQUI que se decide: se o texto pedido e o mesmo que o
           motor ja esta dizendo (ou acabou de dizer, na meia janela de abertura da
           fase), a peca cala — o motor ja cumpriu o pedido dela. Qualquer outra
           fala (a palavra, a silaba, a dica) passa normalmente. */
        var _limpa = function(s){ return String(s||"").replace(/<[^>]*>/g," ")
          .replace(/&[a-z]+;|&#\d+;/gi," ").replace(/\s+/g," ").trim().toLowerCase(); };
        var _agora = _limpa(txt);
        if(_agora && window.__dizMotor && window.__dizMotor === _agora) return;
        try{
          var _b = document.getElementsByClassName("balao")[0];
          if(_b && _limpa(_b.textContent) === _agora){
            window.__dizMotor = _agora;
            setTimeout(function(){ window.__dizMotor = null; }, 1200);
            return;
          }
        }catch(_e){}
        var k = (typeof temVoz === "function") ? temVoz(txt) : null;
        if(k && typeof tocaVoz === "function"){ tocaVoz(k); return; }
        if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
        var u = new SpeechSynthesisUtterance(txt);
        u.lang = "pt-BR"; u.rate = .9; u.pitch = 1.05;
        window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
      }catch(e){}
    };
    limpa();

var li=0;        /* rodada de agora */
var err=0;       /* erros DESTA rodada — o andaime cresce com eles */
var ger=0;       /* geracao da tela: mata setTimeout de fase que ja saiu */

/* ⚠️ LICAO PAGA (ago/2026, achada pelo `_qa/vozigual.js` na atividade do 5º ano):
   `falaDaTela` quer dizer DUAS coisas diferentes nos dois mundos —
     · na BANCADA (o motorzinho aqui de cima) o argumento e o ID DO ELEMENTO, e
       ela le o texto dali e fala pelo navegador;
     · na ATIVIDADE quem atende e o motor, e o argumento e o NOME DA GRAVACAO.
   Chamando `dizTela("balaoP")` a peca soava perfeita na bancada e, na
   atividade, mandava o motor procurar `audio/balaoP.mp3` — que nao existe. O
   enunciado ficava MUDO e o alto-falante nao repetia nada: exatamente a crianca
   que ainda nao le ficando sem instrucao. Aqui a peca pergunta em que mundo
   esta (`temVoz` so existe na atividade) e fala do jeito DAQUELE mundo.      */
function dizTela(id){
  var e=document.getElementById(id); if(!e) return;
  var t=String(e.textContent||"").replace(/\s+/g," ").replace(/^ | $/g,"");
  if(typeof temVoz==="function"){                 /* atividade: voz gravada */
    var k=t?temVoz(t):null;
    if(k && typeof falaDaTela==="function") falaDaTela("op_"+k);
    return;
  }
  if(typeof falaDaTela==="function") falaDaTela(id);   /* bancada: navegador */
}

/* ---------- o coração da mecânica: ele AGE com a regra ensinada ---------- */
function ensina(o,r){

  ocupado=1; sTap();
  limpaCena();          /* tira a sujeira da tentativa anterior */

  setTimeout(function(){
    if(g!==ger) return;
    var by=document.getElementById("byteP");
    if(by) by.style.left="150px";   /* ele vai ate a planta e FICA la */
  },420);
  /* 2) ele DESPEJA o que aprendeu — com o nome escrito */
  setTimeout(function(){
    if(g!==ger) return;

  },1250);

  setTimeout(function(){
    if(g!==ger) return;

/* ⭐ O ERRO ENCENADO. Ele nao "recusa" a regra: ele OBEDECE, e o mundo mostra
   que nao deu certo. Nenhum X vermelho, nenhuma palavra "errou" — a planta
   continua murcha e o Byte PERGUNTA. */
function naoFuncionou(o,r){
  var f=LICOES[li], fa=document.getElementById("falaByte"),
      ce=document.getElementById("cenaP");
  sErro();
  /* o que a regra DEIXA na cena. Regra que nao despeja nada (esperar, falar
     alto) nao deixa nada mesmo — e o proprio "nada aconteceu" e a resposta. */
  if(ce&&r.deixa){
    var resto=el("div",r.deixa,""), nu=document.getElementById("nuvemP");
    /* o resto entra ANTES da nuvem: no escuro, tudo o que esta na cena tem
       que ficar no escuro tambem — pano aceso dentro do quarto escuro parecia
       um adesivo colado por cima da tela. */
    if(nu&&nu.parentNode===ce) ce.insertBefore(resto,nu); else ce.appendChild(resto);
  }
  o.className="opt no";
  o.onclick=null;
  if(o.innerHTML.indexOf("marca")<0) o.innerHTML=o.innerHTML+'<span class="marca fria">n&#227;o funcionou</span>';
  err++;
  if(fa){ fa.innerHTML=f.porque; dizTela("falaByte"); }
  /* rede de seguranca: se as regras erradas acabaram, revela na hora — a
     crianca nao pode ficar olhando uma tela sem saida. */
  var acabou=(sobramErradas()===0);
  mostraDica(acabou?f.d[f.d.length-1]:f.d[Math.min(err,f.d.length)-1]);
  if(err>=3||acabou) revela();
  ocupado=0;
  destrancaTudo();
  /* ⚠️ NAO limpar a cena aqui. O que ele despejou e o monte que ficou SAO a
     prova do erro — se sumissem junto com a pergunta dele, a crianca leria
     "continua murcha" olhando para uma cena limpa, e a mecanica voltaria a
     ser um quiz. A limpeza acontece na tentativa SEGUINTE. */
}
function limpaCena(){

  if(j&&j.parentNode) j.parentNode.removeChild(j);
  var ce=document.getElementById("cenaP"), i, k, m, RESTO=["monte","pano","poca"];
  if(ce) for(i=0;i<RESTO.length;i++){
    k=ce.getElementsByClassName(RESTO[i]);
    while(k.length){ m=k[0]; m.parentNode.removeChild(m); }

}
/* 3º erro: acende a regra que funciona e DEIXA SEGUIR. É o degrau que garante
   que a peça nunca trava — sempre existe caminho para fechar. */

  var a=app.getElementsByClassName("opt"), i;

    function mostraBanner(msg, cb){

        window.mostraBanner(msg || "Muito bem!", _seguir); return;

    /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem ouviu: *"onde tenho que

       chave ignora maiusculas (`chaveVoz` faz `toLowerCase`), entao a palavra
       "pao" acha a gravacao feita para "PAO" — a mesma que o alto-falante da
       opcao ja usa. So cai na voz do navegador se nao houver gravacao. */
    var diz = function(txt){
      try{
        /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem OUVIU: *"o da padaria

           fase), a peca cala — o motor ja cumpriu o pedido dela. Qualquer outra
           fala (a palavra, a silaba, a dica) passa normalmente. */
        var _limpa = function(s){ return String(s||"").replace(/<[^>]*>/g," ")
          .replace(/&[a-z]+;|&#\d+;/gi," ").replace(/\s+/g," ").trim().toLowerCase(); };

            window.__dizMotor = _agora;
            setTimeout(function(){ window.__dizMotor = null; }, 1200);
            return;
          }
        }catch(_e){}
        var k = (typeof temVoz === "function") ? temVoz(txt) : null;
        if(k && typeof tocaVoz === "function"){ tocaVoz(k); return; }
        if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
        var u = new SpeechSynthesisUtterance(txt);
        u.lang = "pt-BR"; u.rate = .9; u.pitch = 1.05;
        window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
      }catch(e){}
    };

function fazOpcao(it){
  var p=it.op, comfig=!!(p.img&&figEl);
  var o=el("div","opt"+(comfig?" comfig":""),"");

     dentro há figura, alto-falante e, depois do acerto, o carimbo "certo".
     DECLARAR o que a voz deve dizer é mais honesto do que fazer o motor
     adivinhar (foi assim que "PÃO" virou "PPÃOjá tentamos" na Padaria). */
  o.setAttribute("data-voz",p.voz);
  if(comfig){ var g=el("div","opfig",""); g.appendChild(figEl(p.img)); o.appendChild(g); }
  var ln=el("div","oplin","");
  ln.appendChild(el("span","optxt",p.t));

   opção com figura é ela, e um `className="opt ok"` cru derrubava a figura
   para o tamanho da opção sem desenho — a tela pulava no acerto. */
function veste(o,estado){
  var fig=(o.className.indexOf("comfig")>=0)?" comfig":"";
  o.className="opt"+fig+(estado?" "+estado:"");
}

/* ⭐ a comemoração curta do acerto: a opção sobe e cresce, e POUSA de volta.
   Duas transições, sem biblioteca e sem `@keyframes` (ver a lição no CSS). */
function festeja(o){
  var g=ger;
  setTimeout(function(){
    if(g!==ger) return;
    if(o.className.indexOf("ok")>=0&&o.className.indexOf("pousa")<0)
      o.className=o.className+" pousa";
  },230);
}

function responde(o,certa){
  if(o.className.indexOf("no")>=0) return;   /* opcao ja apagada: nao responde */
  var f=QZ[qi];
  sTap();                                    /* o toque RESPONDE na hora */
  if(certa){
    sCerto();
    veste(o,"ok");
    /* ⚠️ `appendChild`, NUNCA `innerHTML +=`: reescrever o innerHTML recria os
       filhos e o alto-falante perderia o `onclick` — ficaria um botão bonito e
       mudo justamente depois do acerto. */
    o.appendChild(el("span","marca","certo"));
    festeja(o);
    trancaTudo();
    var g=ger;
    setTimeout(function(){
      if(g!==ger) return;                    /* a fase ja mudou: nao mexe */
      qi++;
      if(qi<QZ.length) pecaEscolher();
      else mostraBanner(FECHO, fimDaPeca);
    },560);
    return;
  }
  /* ERRO: não pune. Som grave curto + a opção sai do alcance + o andaime CRESCE. */
  sErro();
  veste(o,"no");
  o.onclick=null;
  err++;
  /* rede de segurança: se as erradas acabaram, revela na hora — a criança
     não pode ficar olhando uma tela onde só resta uma opção sem ninguém
     dizer nada. Com 4 opções isso coincide com o 3º erro.                 */
  var acabou=(sobramErradas()===0);
  mostraDica(acabou ? f.d[f.d.length-1] : f.d[Math.min(err,f.d.length)-1]);
  if(err>=3||acabou) revela();
}

function sobramErradas(){
  var a=app.getElementsByClassName("opt"), i, n=0;
  for(i=0;i<a.length;i++)
    if(a[i].getAttribute("data-qa")!=="1"&&a[i].className.indexOf("no")<0) n++;
  return n;
}

/* 3º erro: revela a certa e DEIXA SEGUIR. É o degrau que garante que a peça
   nunca trava — sempre existe caminho para fechar. */

  for(i=0;i<a.length;i++){
    if(a[i].getAttribute("data-qa")==="1"){

      /* ⚠️ `appendChild`, nunca `innerHTML +=` — ver a lição em `responde()`:
         reescrever o innerHTML deixaria o alto-falante mudo. */
      if(a[i].getElementsByClassName("marca").length===0)
        a[i].appendChild(el("span","marca","&#233; esta"));
    }
  }
}

  var a=app.getElementsByClassName("opt"), i;
  for(i=0;i<a.length;i++) a[i].onclick=null;
}

       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem ouviu: *"onde tenho que
       ouvir a palavra nao funciona; o enunciado funciona, os sons das opcoes
       funcionam"*. So o botao OUVIR A PALAVRA era mudo.
       A causa: a peca sozinha nao tem gravacao nenhuma, entao ela fala pela
       VOZ ROBO do navegador (`speechSynthesis`). No PC da escola essa voz
       simplesmente nao existe (nao ha voz pt-BR instalada) — e falha CALADA,
       sem erro nenhum. O enunciado e as opcoes funcionavam porque passam pelo
       motor, que toca MP3 gravado.
       Aqui a ponte reaponta o `diz` da peca para a voz da casa. A conta da
       chave ignora maiusculas (`chaveVoz` faz `toLowerCase`), entao a palavra
       "pao" acha a gravacao feita para "PAO" — a mesma que o alto-falante da
       opcao ja usa. So cai na voz do navegador se nao houver gravacao. */
    var diz = function(txt){
      try{
        /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem OUVIU: *"o da padaria
           agora e falado duas vezes juntos, soa estranho"*.
           Varias pecas ganharam, no mesmo dia, a boa ideia de NARRAR SOZINHAS ao
           abrir — porque na bancada, sem motor, a fase ficava muda. So que dentro
           da atividade quem narra o balao e o MOTOR, sempre narrou. As duas vozes
           partiam juntas e se atropelavam.
           A peca nao tem como saber se esta na bancada ou na atividade; quem sabe
           e a ponte. Entao e AQUI que se decide: se o texto pedido e o mesmo que o
           motor ja esta dizendo (ou acabou de dizer, na meia janela de abertura da
           fase), a peca cala — o motor ja cumpriu o pedido dela. Qualquer outra
           fala (a palavra, a silaba, a dica) passa normalmente. */
        var _limpa = function(s){ return String(s||"").replace(/<[^>]*>/g," ")
          .replace(/&[a-z]+;|&#\d+;/gi," ").replace(/\s+/g," ").trim().toLowerCase(); };
        var _agora = _limpa(txt);
        if(_agora && window.__dizMotor && window.__dizMotor === _agora) return;
        try{
          var _b = document.getElementsByClassName("balao")[0];
          if(_b && _limpa(_b.textContent) === _agora){
            window.__dizMotor = _agora;
            setTimeout(function(){ window.__dizMotor = null; }, 1200);
            return;
          }
        }catch(_e){}
        var k = (typeof temVoz === "function") ? temVoz(txt) : null;
        if(k && typeof tocaVoz === "function"){ tocaVoz(k); return; }
        if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
        var u = new SpeechSynthesisUtterance(txt);
        u.lang = "pt-BR"; u.rate = .9; u.pitch = 1.05;
        window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
      }catch(e){}
    };

/* ⚠️⚠️ A VOZ É GRAVADA, SEMPRE. Dentro da atividade montada a ponte do
   integrador injeta o `diz` que toca o mp3 da casa (Edge TTS); sozinha, na
   bancada, a peça fica calada de propósito — voz-robô do navegador nunca vai
   para a criança (portão `_qa/vozrobo.py`). Daí a guarda `typeof`.
   O que a voz fala é EXATAMENTE o que está escrito ao lado do botão. */
function voz(txt){
  if(!txt) return;
  var t=String(txt).replace(/<[^>]+>/g,"").replace(/&#(\d+);/g,function(m,n){
    return String.fromCharCode(Number(n)); });

   DECLARADO, e o portão "função que não existe" consegue medir. */
var figEl = window.imgEl || null;
/* a caixa da figura: SVG embutido (bancada) ou a arte de IA (atividade).

   figura nenhuma. */
function caixaFig(f){
  var cx,im,s;
  if(!f) return null;
  s=String(f);
  cx=el("div","fcfig","");
  im=el("div","fcimg","");
  if(s.charAt(0)==="<"){                  /* SVG embutido: a bancada */
    im.style.backgroundImage="url(\"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s)+"\")";
  }else if(s.indexOf("data:")===0||s.indexOf("/")>=0){
    im.style.backgroundImage="url(\""+s+"\")";
  }else if(figEl){                        /* a arte de IA da atividade */
    im.appendChild(figEl(s));
  }else return null;                      /* sem motor e sem desenho: nada */
  cx.appendChild(im);

}
/* ⭐ O ALTO-FALANTE. Ele recebe um OBJETO (`{t:texto, rot:rótulo}`) e não uma
   string: assim, quando a palavra fecha e a pista vira a palavra certa, o
   MESMO botão passa a falar a palavra — sem botão novo e sem ficar dizendo a
   pista de uma palavra que a criança já descobriu.
   ⚠️ o evento para nele: tocar no botão nunca pode contar como letra. */
function fazZap(alvo){
  var z=el("button","zap","");
  z.type="button";
  z.setAttribute("aria-label","Ouvir "+alvo.rot);
  z.onclick=function(ev){
    var e=ev||window.event;
    if(e.stopPropagation) e.stopPropagation(); else e.cancelBubble=true;
    if(e.preventDefault) e.preventDefault();
    sPing(); voz(alvo.t);
    z.className="zap tocando";
    setTimeout(function(){ z.className="zap"; },900);
    return false;
  };
  return z;
}

function pecaForca(){

  var it=FORCAP[idx], pal=it.p;

      tampa=el("div","fctampa","<b>?</b>Uma figura est&#225; guardada aqui. Descubra a palavra para ver!");
      cxFig.appendChild(tampa);
    }
    c.appendChild(cxFig);
  }

  /* as casinhas da palavra */
  var casas=el("div","casas");
  for(i=0;i<pal.length;i++){
    var q=el("div","letrafc","");
    casas.appendChild(q);
    caixas.push(q);
  }
  c.appendChild(casas);

  /* os balões que sobram + o número escrito (nunca só a cor, nunca só a figura) */
  var chan=el("div","chances");
  var bolas=[];
  for(i=0;i<MAXE;i++){ var bo=el("i","chance",""); chan.appendChild(bo); bolas.push(bo); }
  var ctx=el("b","f2_ctx","Voc&#234; tem "+MAXE+" tentativas.");
  chan.appendChild(ctx);
  c.appendChild(chan);

  var tec=el("div","teclado");
  for(i=0;i<ALFA.length;i++){(function(L){
    var b=el("button","tecl",L);
    /* ⭐ data-qa="1" = "esta letra está na palavra". Existe SÓ para o
       auditor-jogador; a criança não vê diferença nenhuma. */
    b.setAttribute("data-qa", pal.indexOf(L)>=0 ? "1" : "0");
    b.onclick=function(){ ac(); tenta(L,b); };
    teclas[L]=b;
    tec.appendChild(b);
  })(ALFA.charAt(i));}
  c.appendChild(tec);
  c.appendChild(el("div","hint","Toque nas letras ou use o teclado do computador. O alto-falante diz a pista. A palavra vai sem acento."));
  t.appendChild(c);
  app.appendChild(t);

  /* ⭐ AS DUAS PORTAS: teclado na tela E teclado de verdade.
     ⚠️ o guarda `!t.parentNode` impede que uma tela que já saiu continue
     respondendo por cima da tela seguinte.                                */
  document.onkeydown=function(ev){
    if(!t.parentNode){ document.onkeydown=null; return; }
    var L=String.fromCharCode(ev.keyCode||ev.which||0).toUpperCase();
    if(!/^[A-Z]$/.test(L)) return;
    ac();
    if(teclas[L]&&teclas[L].className.indexOf("usada")<0) tenta(L,teclas[L]);
  };

  function mostra(){
    var z,todas=true,n=0;
    for(z=0;z<pal.length;z++){
      if(achou[pal.charAt(z)]){
        caixas[z].innerHTML=pal.charAt(z);
        if(caixas[z].className.indexOf("achada")<0) caixas[z].className="letrafc achada";
        n++;
      } else todas=false;
    }
    barraP.style.width=Math.round((idx*100+n*100/pal.length)/FORCAP.length)+"%";
    return todas;
  }
  function faixa(txt){
    var f=el("div","achouf"+(cxFig?" alta":""),txt+"!");
    document.body.appendChild(f);
    setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); },1400);

      idx++;

      else mostraBanner("Voc&#234; descobriu as <b>"+FORCAP.length+"</b> palavras, letra por letra!",fimDaPeca);

  /* ⭐ A REVELAÇÃO DA FIGURA (o prêmio). Serve para os dois fins: quando ela
     descobre (é festa) e quando os balões acabam (aí é consolo, não castigo —
     a criança fica conhecendo o bicho de qualquer jeito). E o alto-falante
     passa a falar a PALAVRA CERTA, com acento. */
  function revelaFig(){

      achou[pal.charAt(z)]=1;
      caixas[z].innerHTML=pal.charAt(z);

    var msg="Era <b>"+(it.ac||pal)+"</b>. Olhe bem para ela &#8212; a pr&#243;xima voc&#234; pega.";
    revelaFig();
    pistaEl.innerHTML=msg;
    trocaFalado(it.ac||pal,"a palavra");
    voz(msg);
    mostraDica("Dica de quem joga bem: comece sempre pelas vogais A, E, I, O, U.");
    segue(3000);

    if(fim) return;
    if(b.className.indexOf("usada")>=0){ sTap(); return; }

    b.setAttribute("data-qa","0");

      achou[L]=1;
      b.className="tecl usada certa";
      sPop(pal.indexOf(L)+1);

      erros++;
      b.className="tecl usada fora";

         último balão a peça muda de tom: ela vai MOSTRAR a palavra, e isso

      ctx.innerHTML = (MAXE-erros)>1 ? "Faltam <b>"+(MAXE-erros)+"</b> tentativas."

                                        : "Vamos olhar a palavra <b>juntos</b>.");
      if(erros===2) mostraDica("Tente as <b>vogais</b> que ainda faltam: A, E, I, O, U.");
      if(erros===4) mostraDica("A palavra come&#231;a com <b>"+pal.charAt(0)+"</b>.");
      if(erros>=MAXE) entrega();
    }
  }
  mostra();
}

  c.appendChild(el("div","hint","Esta &#233; a pe&#231;a FORCA: palavra sem acento para digitar, com acento na festa, letra usada fora do alcance."));
  t.appendChild(c);

    if(f && f.dados) FORCAP = f.dados;

/* ==== PECA: intruso ==== */
MEC["intruso"] = function(f, cen, fim){
  cen.className = cen.className + " mec-intruso";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";

    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem ouviu: *"onde tenho que
       ouvir a palavra nao funciona; o enunciado funciona, os sons das opcoes
       funcionam"*. So o botao OUVIR A PALAVRA era mudo.
       A causa: a peca sozinha nao tem gravacao nenhuma, entao ela fala pela
       VOZ ROBO do navegador (`speechSynthesis`). No PC da escola essa voz
       simplesmente nao existe (nao ha voz pt-BR instalada) — e falha CALADA,
       sem erro nenhum. O enunciado e as opcoes funcionavam porque passam pelo
       motor, que toca MP3 gravado.
       Aqui a ponte reaponta o `diz` da peca para a voz da casa. A conta da
       chave ignora maiusculas (`chaveVoz` faz `toLowerCase`), entao a palavra
       "pao" acha a gravacao feita para "PAO" — a mesma que o alto-falante da
       opcao ja usa. So cai na voz do navegador se nao houver gravacao. */
    var diz = function(txt){
      try{
        /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem OUVIU: *"o da padaria
           agora e falado duas vezes juntos, soa estranho"*.
           Varias pecas ganharam, no mesmo dia, a boa ideia de NARRAR SOZINHAS ao
           abrir — porque na bancada, sem motor, a fase ficava muda. So que dentro
           da atividade quem narra o balao e o MOTOR, sempre narrou. As duas vozes
           partiam juntas e se atropelavam.
           A peca nao tem como saber se esta na bancada ou na atividade; quem sabe
           e a ponte. Entao e AQUI que se decide: se o texto pedido e o mesmo que o
           motor ja esta dizendo (ou acabou de dizer, na meia janela de abertura da
           fase), a peca cala — o motor ja cumpriu o pedido dela. Qualquer outra
           fala (a palavra, a silaba, a dica) passa normalmente. */
        var _limpa = function(s){ return String(s||"").replace(/<[^>]*>/g," ")
          .replace(/&[a-z]+;|&#\d+;/gi," ").replace(/\s+/g," ").trim().toLowerCase(); };
        var _agora = _limpa(txt);
        if(_agora && window.__dizMotor && window.__dizMotor === _agora) return;
        try{

            window.__dizMotor = _agora;
            setTimeout(function(){ window.__dizMotor = null; }, 1200);
            return;
          }
        }catch(_e){}
        var k = (typeof temVoz === "function") ? temVoz(txt) : null;
        if(k && typeof tocaVoz === "function"){ tocaVoz(k); return; }
        if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
        var u = new SpeechSynthesisUtterance(txt);
        u.lang = "pt-BR"; u.rate = .9; u.pitch = 1.05;
        window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
      }catch(e){}
    };
    limpa();

function temClasse(e,c){
  if(!e||e.nodeType!==1) return false;
  return (" "+String(e.className)+" ").indexOf(" "+c+" ")>=0;
}
/* ⭐⭐ A VOZ (pilar SONORA). Quem toca a voz DE VERDADE é a ponte do integrador
   (`_padrao/ESQUELETO/integrar.py`), que injeta um `var diz = function(txt)`
   ligado às gravações da casa (Edge TTS) ANTES do corpo da peça. Aqui a peça só
   PEDE — e pede protegida por `typeof`, porque na bancada, sozinha, não há
   gravação nenhuma e nada pode estourar.
   ⚠️ NUNCA chamar `speechSynthesis` daqui: a voz-robô do navegador briga com a
   voz da casa (dois falando junto, defeito que o Marcos já ouviu) e o portão
   `_qa/vozrobo.py` reprova. Tudo o que a voz diz está TAMBÉM escrito na tela,
   então PC sem caixa de som continua jogando a peça inteira. */
function semTag(t){
  var d=document.createElement("div");
  d.innerHTML=String(t===undefined||t===null?"":t).replace(/<br\s*\/?>/gi," ");
  return (d.textContent||d.innerText||"").replace(/\s+/g," ").replace(/^ | $/g,"");
}
function fala(txt){
  var t=semTag(txt);
  if(!t) return;
  if(typeof diz==="function") diz(t);
}
/* a FIGURA. `img` chega como o NOME do arquivo ("cenoura" -> img/cenoura.png),
   que é a convenção da casa; um endereço pronto ("/" ou "data:") também serve. */
function figura(nome,cls){
  var s=String(nome), im=el("img",cls);
  im.src=(s.indexOf("/")>=0||s.indexOf("data:")===0)?s:("img/"+s+".png");
  im.alt="";
  return im;
}
/* o alto-falante de uma resposta: só fala, nunca escolhe. */
function fazZap(txt){
  var z=el("button","zap","");
  z.setAttribute("type","button");
  z.setAttribute("aria-label","Ouvir "+semTag(txt));
  z.appendChild(el("i","fone",""));
  z.onclick=function(ev){
    var e2=ev||window.event;
    if(e2&&e2.stopPropagation) e2.stopPropagation(); else if(e2) e2.cancelBubble=true;
    sTap(); fala(txt);
  };
  return z;
}

/* ⚠️ o temporizador continua correndo depois do limpa(): sem o guarda da

function destreme(b,base){
  var g=ger;

/* ⭐ A REDE DAS ERRADAS QUE ACABAM (licao do CONTRATO, secao 6): "um quiz com
   2 distratores faz a crianca eliminar tudo antes do 3o erro — o degrau
   REVELAR vira codigo morto". Aqui cada passo tem TRES erradas, entao os tres

function sobramErradas(){

    if(!temClasse(caixas[i],"injat")&&!temClasse(caixas[i],"ok")&&

function fazCoisa(o,R){
  var b=el("div","opt","");
  b.className="opt incoisa";
  /* ⭐ A FIGURA VEM EM CIMA DA PALAVRA. Três caminhos, nesta ordem:
       · `img`  — arte de IA da atividade (o normal numa fase de verdade);
       · `fig`  — a forma desenhada em CSS (a rodada das figuras geométricas,
                  onde o conteúdo É a forma e não há o que ilustrar);
       · nada   — só a palavra, e a peça continua inteira: nenhuma atividade
                  antiga quebra por não trazer figura. */
  if(o.img||o.fig){
    var cx=el("div","infigbox","");
    if(o.img) cx.appendChild(figura(o.img,"inimg"));
    else cx.appendChild(el("span","infig "+o.fig,""));
    b.appendChild(cx);
  }
  b.appendChild(el("span",(R.tipo==="numero")?"innome innum":"innome",o.n));
  /* o alto-falante: a criança ouve o nome quantas vezes quiser sem gastar
     tentativa — sem isso, quem não lê escolhe pelo desenho e a fase vira sorte */
  b.appendChild(fazZap(o.n));
  b._o=o;
  /* a tela publica em data-qa a resposta que serve AGORA — so para o
     auditor-jogador conseguir fechar a fase (convencao da casa). */
  b.setAttribute("data-qa",(o.k===R.fora)?"1":"0");
  b.onclick=function(){ tocaCoisa(b); };
  caixas.push(b);
  return b;
}
function tocaCoisa(b){
  if(!viva()) return;
  if(travada){ sTap(); return; }        /* rodada ja resolvida: responde, nao emudece */
  var R=RODADAS[rodada];
  /* ⚠️ JA TENTADA: responde com SOM e com PALAVRAS, nunca com silencio. */
  if(temClasse(b,"injat")){
    sTap();
    ajuda("Nesta n&#243;s j&#225; tentamos. Olhe as outras <b>tr&#234;s</b>.");
    return;
  }
  if(b._o.k===R.fora){ achou(b,false); return; }
  sErro(); errosSeg++;
  b.className="opt incoisa injat";
  b.appendChild(el("span","inmarca","j&#225; tentamos"));
  b.setAttribute("data-qa","0");
  destreme(b,"opt incoisa injat");
  if(errosSeg===1) ajuda(R.d1);
  else if(errosSeg===2) ajuda(R.d2);
  if(errosSeg>=3){ ajuda("Deixa comigo: eu mostro qual &#233; a de fora e explico."); esperaERevela1(1100); }
  else if(sobramErradas()===0) esperaERevela1(2600);   /* a rede: erradas acabaram antes */
}
/* ⚠️ DEFEITO PAGO EM CINCO PEÇAS DE UM LOTE SÓ (ago/2026): no 3º degrau a
   explicacao era escrita e APAGADA no mesmo quadro, porque o "revelar" trocava
   de tela. Ordem certa: espera a dica ser lida, REVELA, escreve a explicacao
   DEPOIS — e a tela so troca quando a crianca toca em "Continuar".        */
function esperaERevela1(atraso){
  var g=ger, R=RODADAS[rodada];
  setTimeout(function(){
    if(g!==ger||!viva()||travada) return;

  marcaQA(r);
  voz(SILTXT.balao||"");
}

/* ⭐ OS DOIS ALTO-FALANTES da palavra que está sendo montada.

function fazSilaba(item, r){
  var b=el("button","jsSil", item.s);
  b.type="button";
  b._sil=item.s;
  /* ⭐ AS TRÊS PORTAS (ordem do Marcos, ago/2026: *"nas atividades de clicar,
     quando for possível, pode ser de arrastar também"*). Aqui o arrastar não é
     só uma porta a mais: ARRASTAR **É** O DESLIZE que a pesquisa pede — a
     criança faz com a mão o que o conceito diz (duas partes que correm uma até
     a outra e viram uma só). Toque, clique e arrasto, os três.
     ⚠️ o guarda do MOUSE FANTASMA: no celular o navegador dispara eventos de
     mouse DEPOIS do toque, e sem este guarda eles desfaziam o gesto. Defeito já
     pego duas vezes na casa. */
  arrastavel(b, r);
  b.onclick=function(){
    if(b._ultimoToque && (new Date()).getTime()-b._ultimoToque<700) return;
    if(b.className.indexOf("usada")>=0) return;
    var esperada=r.sil[posto];
    if(item.s===esperada && b.className.indexOf("usada")<0){
      deslizaAte(b, document.getElementById("jsv"+posto), r);
    } else {
      /* ⚠️ ERRO NÃO PUNE: a peça devolve o pedaço com som GRAVE E CURTO, de
         retorno, nunca de tropeço. O gesto está em treino, e no 1º ano errar a
         ordem é o normal. */
      err++; sErro(); sVolta();
      b.className="jsSil";
      ajuda(err, r);
    }
  };
  return b;
}

/* ⭐ PEGOU O PEDAÇO: som na hora e a SÍLABA DITA. É o coração da fase — a
   criança de 6 anos escolhe pelo SOM, não pela letra, e é ouvindo "BO" na mão
   dela que a sílaba deixa de ser desenho e vira som. Vale para o dedo e para o
   mouse; o clique seco do auditor não passa por aqui, e não precisa. */
function pegou(b){
  if(!b || b.className.indexOf("usada")>=0) return;
  sTap(); voz(b._sil);
}

/* o ARRASTO: mouse e dedo. Solta em cima da forma = a mesma coisa que tocar. */
function arrastavel(b, r){
  var mx=0,my=0,arr=false;
  function comeca(x,y,ev){
    if(b.className.indexOf("usada")>=0) return;
    pegou(b);
    arr=true; mx=x; my=y;
    b.style.zIndex="30"; b.style.position="relative";
    if(ev&&ev.type==="mousedown"&&ev.preventDefault) ev.preventDefault();
  }
  function move(x,y){
    if(!arr) return;
    b.style.webkitTransform="translate("+(x-mx)+"px,"+(y-my)+"px)";
    b.style.transform="translate("+(x-mx)+"px,"+(y-my)+"px)";
  }
  function solta(x,y){
    if(!arr) return;
    arr=false;
    b.style.webkitTransform=""; b.style.transform=""; b.style.zIndex="";
    var v=document.getElementById("jsv"+posto);
    if(v){
      var q=v.getBoundingClientRect();
      /* margem generosa: dedo de 6 anos nao acerta o pixel */
      if(x>q.left-30&&x<q.right+30&&y>q.top-30&&y<q.bottom+30){ b.onclick(); return; }
    }
    sVolta();
  }
  b.onmousedown=function(e){ comeca(e.clientX,e.clientY,e); };
  b.onmousemove=function(e){ move(e.clientX,e.clientY); };
  b.onmouseup  =function(e){ solta(e.clientX,e.clientY); };
  b.onmouseleave=function(e){ if(arr) solta(e.clientX,e.clientY); };
  /* ⚠️ NUNCA `preventDefault` no touchstart: mata o toque simples. */
  b.addEventListener("touchstart",function(e){
    var t=e.touches[0]; b._ultimoToque=(new Date()).getTime(); comeca(t.clientX,t.clientY,null);
  },false);
  b.addEventListener("touchmove",function(e){
    var t=e.touches[0]; move(t.clientX,t.clientY);
    if(arr&&e.preventDefault) e.preventDefault();
  },false);
  b.addEventListener("touchend",function(e){
    var t=(e.changedTouches&&e.changedTouches[0])||{clientX:0,clientY:0};
    b._ultimoToque=(new Date()).getTime();
    var q=document.getElementById("jsv"+posto);
    /* soltou longe da forma? entao foi TOQUE simples, e toque simples tambem vale */
    if(q){ var g=q.getBoundingClientRect();
      if(!(t.clientX>g.left-30&&t.clientX<g.right+30&&t.clientY>g.top-30&&t.clientY<g.bottom+30)){
        arr=false; b.style.webkitTransform=""; b.style.transform="";
        b.onclick(); return; } }
    solta(t.clientX,t.clientY);
  },false);
}

/* ⭐ O DESLIZE — o coração da peça (Reading Rockets: "have the sounds slide
   together to form a word"). A sílaba corre da bandeja até o lugar dela, e só
   depois de chegar é que ela vira parte da palavra. */
function deslizaAte(b, vaga, r){
  var meu=ger;
  var a=b.getBoundingClientRect(), v=vaga.getBoundingClientRect();
  b.style.setProperty("--dx",(v.left-a.left+(v.width-a.width)/2)+"px");
  b.style.setProperty("--dy",(v.top-a.top+(v.height-a.height)/2)+"px");
  b.className="jsSil desliza";
  sDesliza();
  voz(b._sil);
  setTimeout(function(){
    if(meu!==ger) return;
    b.className="jsSil usada";
    vaga.innerHTML=b._sil;
    vaga.className="jsVaga cheia";
    posto++;
    var prox=document.getElementById("jsv"+posto);
    if(prox) prox.className="jsVaga agora";
    marcaQA(r);
    if(posto>=r.sil.length) fechaPalavra(r);
  },380);
}

function fechaPalavra(r){
  var meu=ger;
  sCerto(); festa();
  var c=app.querySelector(".centro");
  var p=el("div","jsPronta", r.pal);
  c.appendChild(p);
  /* ⭐⭐ O SOM CONTÍNUO. A pesquisa é explícita: "Connected Phonation Is More
     Effective than Segmented Phonation". A palavra fecha dita de UMA VEZ —
     nunca "BO... LO". É aqui que a criança ouve que dois pedaços viraram um. */
  voz(r.pal);
  setTimeout(function(){
    if(meu!==ger) return;
    ri++;
    if(ri>=SILABAS.length) fimDaPeca(); else pecaJuntar();
  },1400);
}

/* o ANDAIME que cresce — e que nunca deixa a criança presa */
function ajuda(n, r){
  var d=r.d||[], txt;
  if(n===1){ txt=d[0]||"Diga a palavra devagar."; mostraDica(txt); dizDica(txt); }
  else if(n===2){ txt=d[1]||"Escute o come&#231;o da palavra.";
    mostraDica(txt); dizDica(txt);
    pisca(r, false); }
  else if(n>=3){
    /* revela PRIMEIRO, escreve a dica DEPOIS — senão a fase se conserta
       sozinha e a criança não sabe por quê (lição paga em 5 de 6 peças) */
    pisca(r, true);
    txt=d[2]||"Toque no peda&#231;o aceso.";
    setTimeout(function(){ mostraDica(txt); },60);
    dizDica(txt);
  }
}
/* ⚠️ A DICA FALADA ESPERA (regra da casa, pilar SONORA): a criança acabou de
   ouvir a sílaba que pegou. Falar a dica no mesmo instante CORTA aquela voz —
   e é justamente a voz que ela pediu ao tocar. Meio segundo depois, a sílaba já
   terminou e a ajuda entra limpa. O guarda de geração mata o temporizador de
   uma rodada que já saiu da tela. */

  var meu=ger;
  setTimeout(function(){ if(meu!==ger) return; voz(txt); },520);
}
function pisca(r, acende){

      }

/* `data-qa="1"` na sílaba que serve AGORA: é assim que o auditor-jogador
   atravessa a peça. Só para ele — a criança nunca vê isto. */
function marcaQA(r){

/* ==== PECA: letras-escondidas ==== */
MEC["letras-escondidas"] = function(f, cen, fim){
  cen.className = cen.className + " mec-letras-escondidas";
  /* ⚠️⚠️ LICAO PAGA, e a mais silenciosa de todas: a peca da MEMORIA declara a
     PROPRIA `function fim()`. Como o corpo dela entra dentro do fechamento, esse
     `fim` SOMBREAVA o parametro da ponte — e o `mostraBanner` daqui, que devia
     levar a fase seguinte, chamava a peca de volta. Laco infinito, sem erro de
     JS nenhum: o jogador so ficava PRESO, com todos os pares ja fechados e a
     medalha da peca na tela. Por isso a continuacao mora AQUI FORA, com um nome
     que o integrador confere que nenhuma peca usa (ver `confere_contra_motor`).
     E ela so dispara UMA vez: peca que chama o banner duas vezes pularia fase. */
  var _seguir = function(){ if(_seguir.ja) return; _seguir.ja = 1; fim(); };
  /* recolhe o enunciado da fase assim que a peca puser o balao dela (ver CSS) */
  setTimeout(function(){
    var b = cen.getElementsByClassName("pecabox")[0];
    if(b && b.getElementsByClassName("balao").length)
      cen.className = cen.className + " tembalaopeca";
  }, 120);
  (function(){
    /* a peca acha que esta sozinha; estes ajudantes fazem o meio de campo */
    var app = cen;
    /* o `ac()` DESTA peca: destrava o som (o motor chama isso de `arma()`) e
       devolve o AudioContext do motor. Fica local, dentro do fechamento, para
       nao brigar com o `var ac` do motor — que e o objeto, nao a funcao. */
    function ac(){ if(typeof arma === "function") arma(); return window.ac; }
    function limpa(){ var g = cen.getElementsByClassName("pecabox")[0];
      if(g) g.innerHTML = ""; else { g = document.createElement("div");
      g.className = "pecabox"; cen.appendChild(g); } app = g; }
    /* ⚠️ LICAO PAGA: este ajudante era um VAZIO — "quem manda na barra e o
       motor". So que o caca-palavras faz `setProg(t,0)` e depois PEGA A BARRA
       DE VOLTA (`t.getElementsByTagName("i")[0]`) para mostrar quantas palavras
       ja achou. Com o vazio, ele pegava `undefined` e estourava no primeiro
       toque: 446 erros de JS numa partida. Regra: o ajudante da ponte tem que
       FAZER o que o de verdade faz — nao pode so nao atrapalhar.
       A barra da PECA e a de dentro da fase (5 palavras achadas de 8); a do
       MOTOR e a da atividade (fase 4 de 32). As duas informam coisas
       diferentes, entao as duas ficam — a de dentro, menorzinha (ver CSS). */
    function setProg(t, p){
      if(!t || !t.appendChild) return;
      var pr = document.createElement("div"); pr.className = "prog progpeca";
      var i = document.createElement("i"); i.style.width = (p || 0) + "%";
      pr.appendChild(i); t.appendChild(pr);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), pega pelo Marcos JOGANDO: *"esta passando de
       fase sem aquele botao azul que aparecia com a palavra proximo... tem que
       ser parecida com a atividade do Broto"*.

       Esta ponte comemorava e PULAVA para a fase seguinte sozinha, 420ms
       depois. A crianca terminava uma fase e era JOGADA na outra: sem a tela de
       parabens, sem o mascote dizendo o que ela conseguiu, sem o botao para ela
       decidir quando seguir. No Broto — que e o modelo — cada fase fecha com o
       banner e a crianca TOCA para continuar. Era o fecho de toda fase de toda
       atividade montada que estava faltando.

       Agora a ponte chama o banner DE VERDADE do motor (`window.mostraBanner`,
       que a funcao local aqui dentro sombreia) e entrega o `_seguir` como o
       botao. A peca continua so avisando que acabou; quem manda no caminho
       segue sendo o motor — mas com a comemoracao no meio. */
    function mostraBanner(msg, cb){
      if(typeof festa === "function") festa();
      if(typeof window.mostraBanner === "function"){
        window.mostraBanner(msg || "Muito bem!", _seguir); return;
      }
      setTimeout(_seguir, 420);
    }
    /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem ouviu: *"onde tenho que
       ouvir a palavra nao funciona; o enunciado funciona, os sons das opcoes
       funcionam"*. So o botao OUVIR A PALAVRA era mudo.
       A causa: a peca sozinha nao tem gravacao nenhuma, entao ela fala pela
       VOZ ROBO do navegador (`speechSynthesis`). No PC da escola essa voz
       simplesmente nao existe (nao ha voz pt-BR instalada) — e falha CALADA,
       sem erro nenhum. O enunciado e as opcoes funcionavam porque passam pelo
       motor, que toca MP3 gravado.
       Aqui a ponte reaponta o `diz` da peca para a voz da casa. A conta da
       chave ignora maiusculas (`chaveVoz` faz `toLowerCase`), entao a palavra
       "pao" acha a gravacao feita para "PAO" — a mesma que o alto-falante da
       opcao ja usa. So cai na voz do navegador se nao houver gravacao. */
    var diz = function(txt){
      try{
        /* ⚠️⚠️ LICAO PAGA (ago/2026), e foi o Marcos quem OUVIU: *"o da padaria
           agora e falado duas vezes juntos, soa estranho"*.
           Varias pecas ganharam, no mesmo dia, a boa ideia de NARRAR SOZINHAS ao
           abrir — porque na bancada, sem motor, a fase ficava muda. So que dentro
           da atividade quem narra o balao e o MOTOR, sempre narrou. As duas vozes
           partiam juntas e se atropelavam.
           A peca nao tem como saber se esta na bancada ou na atividade; quem sabe
           e a ponte. Entao e AQUI que se decide: se o texto pedido e o mesmo que o
           motor ja esta dizendo (ou acabou de dizer, na meia janela de abertura da
           fase), a peca cala — o motor ja cumpriu o pedido dela. Qualquer outra
           fala (a palavra, a silaba, a dica) passa normalmente. */
        var _limpa = function(s){ return String(s||"").replace(/<[^>]*>/g," ")
          .replace(/&[a-z]+;|&#\d+;/gi," ").replace(/\s+/g," ").trim().toLowerCase(); };
        var _agora = _limpa(txt);
        if(_agora && window.__dizMotor && window.__dizMotor === _agora) return;
        try{
          var _b = document.getElementsByClassName("balao")[0];
          if(_b && _limpa(_b.textContent) === _agora){
            window.__dizMotor = _agora;
            setTimeout(function(){ window.__dizMotor = null; }, 1200);
            return;
          }
        }catch(_e){}
        var k = (typeof temVoz === "function") ? temVoz(txt) : null;
        if(k && typeof tocaVoz === "function"){ tocaVoz(k); return; }
        if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return;
        var u = new SpeechSynthesisUtterance(txt);
        u.lang = "pt-BR"; u.rate = .9; u.pitch = 1.05;
        window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
      }catch(e){}
    };
    limpa();
